openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Opsly API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: orgs
    description: Organization management
  - name: projects
    description: IT project operations
  - name: tasks
    description: Task operations
  - name: comments
    description: Comment operations
  - name: notes
    description: Rich-text scratch pad notes
  - name: dashboard
    description: Dashboard and analytics
  - name: webhooks
    description: Inbound and outbound webhook management
  - name: custom-fields
    description: Custom field definition management
  - name: views
    description: Saved filter views
  - name: workflow-stages
    description: Org-defined workflow stage management
  - name: api-keys
    description: API key management for programmatic access

paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      description: >
        Returns the user object for the active session, or `null` when no valid
        session is present. Accepts either a `Bearer <sid>` Authorization header
        (mobile) or the `sid` session cookie (browser). Never returns a 401 -
        callers must check whether the returned `user` field is null.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      description: >
        Generates a PKCE code challenge, stores transient OIDC state in
        short-lived cookies (`code_verifier`, `nonce`, `state`, `return_to`),
        and issues a 302 redirect to the OIDC provider's authorization endpoint.
        Use `returnTo` to control where the browser lands after a successful
        login; the value must start with `/` and will default to `/` if absent
        or unsafe.
      parameters:
        - name: returnTo
          in: query
          required: false
          description: >
            Relative path to redirect to after a successful login. Must start
            with `/`. Defaults to `/` if omitted or invalid.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      description: >
        Validates the OIDC authorization code response using the PKCE verifier
        and state stored in cookies, exchanges the code for tokens, upserts the
        user record in the database, creates a session, and redirects to the
        `returnTo` path. On any failure (missing cookies, invalid state,
        exchange error) the browser is redirected back to `/api/login`.
      parameters:
        - name: code
          in: query
          required: false
          description: Authorization code returned by the OIDC provider.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: Opaque state value echoed back by the OIDC provider for CSRF protection.
          schema:
            type: string
        - name: iss
          in: query
          required: false
          description: Issuer identifier echoed back by some OIDC providers.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      description: >
        Destroys the server-side session identified by the `Authorization`
        header or `sid` cookie, clears the cookie, and redirects to the OIDC
        provider's end-session endpoint so the provider session is also
        invalidated. The `returnTo` parameter controls where the provider
        redirects the browser after logout.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          description: >
            Relative path to redirect to after logout. Must start with `/`.
            Defaults to `/`.
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      description: >
        Accepts the OIDC authorization code produced by a mobile PKCE flow,
        validates it against the OIDC provider, upserts the user record, and
        returns an opaque session token (`sid`). The caller must include this
        token as `Bearer <token>` in the `Authorization` header on subsequent
        requests. Returns 400 if required fields are missing, 401 if the ID
        token contains no usable claims, and 500 if the provider token exchange
        fails.
      requestBody:
        required: true
        description: OIDC authorization code and associated PKCE parameters from the mobile app.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      description: >
        Deletes the server-side session identified by the `Authorization: Bearer
        <sid>` header. Always returns 200 even when no session is found, so
        callers can safely call this without knowing whether the token is still
        valid.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: >
        Returns the current server health status. Intended for load-balancer and
        uptime probes. Requires no authentication and always responds with HTTP
        200 as long as the process is running.
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      description: >
        Returns every project belonging to the caller's organization, ordered by
        creation date (oldest first). Each project includes aggregated
        `taskCount` and `completedTaskCount` computed from tasks in the same org.
        Requires an active org membership; returns 401 if the session is missing
        or 403 if the user is not a member of any org.
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      description: >
        Creates a new project scoped to the caller's organization. The `orgId`
        is taken from the authenticated session - it cannot be supplied by the
        caller. Returns 400 if the request body is invalid.
      requestBody:
        required: true
        description: Fields for the new project. `name`, `status`, and `priority` are required.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      description: >
        Retrieves a single project by its numeric ID, scoped to the caller's
        organization. Returns 404 if the project does not exist or belongs to a
        different org (to prevent cross-tenant enumeration).
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the project.
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found or does not belong to the caller's organization.
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      description: >
        Partially updates one or more fields of an existing project. Only
        supplied fields are changed; omitted fields retain their current values.
        Returns 404 if the project does not exist or belongs to a different org.
        Returns 400 if the request body fails validation.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the project to update.
          schema:
            type: integer
      requestBody:
        required: true
        description: Partial set of project fields to update. All fields are optional.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found or does not belong to the caller's organization.
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      description: >
        Permanently deletes the project. Returns 404 if the project does not
        exist or belongs to a different org. Associated tasks are not
        automatically deleted - they retain their `projectId` reference.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the project to delete.
          schema:
            type: integer
      responses:
        "204":
          description: Project deleted successfully. No body returned.

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks with optional filters
      description: >
        Returns all tasks for the caller's organization, ordered by creation
        date (oldest first). Each task is enriched with `projectName` (from the
        linked project, if any, scoped to the same org) and a `commentCount`.
        Supply one or more query parameters to narrow the results. Returns 400
        if a query parameter value is not a recognized enum value.
      parameters:
        - name: projectId
          in: query
          description: Filter tasks by project ID. Returns only tasks linked to this project.
          schema:
            type: integer
        - name: status
          in: query
          description: >
            Filter by task status. One of `todo`, `in_progress`, `blocked`, or
            `done`.
          schema:
            type: string
        - name: priority
          in: query
          description: >
            Filter by task priority. One of `low`, `medium`, `high`, or
            `critical`.
          schema:
            type: string
        - name: category
          in: query
          description: >
            Filter by task category. One of `incident`, `change`,
            `maintenance`, `deployment`, `support`, or `other`.
          schema:
            type: string
        - name: assignee
          in: query
          description: >
            Filter by assignee email address. Returns only tasks assigned to
            this org member.
          schema:
            type: string
        - name: dateFrom
          in: query
          description: >
            Filter tasks with a due date on or after this date (ISO 8601,
            YYYY-MM-DD). Use together with `dateTo` for a date range.
          schema:
            type: string
        - name: dateTo
          in: query
          description: >
            Filter tasks with a due date on or before this date (ISO 8601,
            YYYY-MM-DD). Use together with `dateFrom` for a date range.
          schema:
            type: string
        - name: slaBreached
          in: query
          description: >
            When `"true"`, returns only tasks where `slaBreachedAt` is set
            (i.e. tasks that have crossed their SLA deadline). Omit or pass
            `"false"` to return all tasks regardless of SLA breach status.
          schema:
            type: string
            enum: ["true", "false"]
        - name: customFieldId
          in: query
          description: >
            Filter by a custom field. Must be a positive integer matching a
            non-deleted custom field definition that belongs to the caller's
            org. When provided alone, returns tasks that have any non-null
            value for this field. Combine with `customFieldValue` to match a
            specific value.
          schema:
            type: integer
        - name: customFieldValue
          in: query
          description: >
            Exact value to match for the custom field identified by
            `customFieldId`. Only meaningful when `customFieldId` is also
            supplied; ignored otherwise. For single_select and multi_select
            fields this is the option string to match.
          schema:
            type: string
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a new task
      description: >
        Creates a new task scoped to the caller's organization. If `projectId`
        is supplied it must belong to the same org, otherwise a 400 is returned.
        If `assignee` (an email address) is supplied it must match a member of
        the org, otherwise a 400 is returned. The `orgId` is set automatically
        from the session.
      requestBody:
        required: true
        description: Fields for the new task. `title`, `status`, `priority`, and `category` are required.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task by ID
      description: >
        Retrieves a single task by numeric ID, scoped to the caller's
        organization. Returns 404 if the task does not exist or belongs to a
        different org. The response includes the linked project name and comment
        count.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the task.
          schema:
            type: integer
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found or does not belong to the caller's organization.
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      description: >
        Partially updates one or more fields of a task. Only supplied fields are
        changed. If `projectId` is provided it must belong to the caller's org.
        If `assignee` is provided it must be an org member email. Returns 404 if
        the task is not found. Returns 400 if validation fails.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the task to update.
          schema:
            type: integer
      requestBody:
        required: true
        description: Partial set of task fields to update. All fields are optional.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found or does not belong to the caller's organization.
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      description: >
        Permanently deletes the task and returns 204 on success. Returns 404 if
        the task does not exist or belongs to a different org. Comments attached
        to the task are cascade-deleted by the database.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the task to delete.
          schema:
            type: integer
      responses:
        "204":
          description: Task deleted successfully. No body returned.

  /tasks/{id}/comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: List comments for a task
      description: >
        Returns all comments for the specified task, ordered by creation date
        (oldest first). The task must belong to the caller's organization;
        returns 404 if the task is not found or belongs to another org.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the task whose comments to list.
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags: [comments]
      summary: Add a comment to a task
      description: >
        Appends a new comment to the specified task. The task must belong to the
        caller's organization; returns 404 if the task is not found or belongs
        to another org. Returns 400 if the request body is invalid (e.g. empty
        `content`).
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the task to comment on.
          schema:
            type: integer
      requestBody:
        required: true
        description: Comment content and optional author display name.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /tasks/{id}/events:
    get:
      operationId: listTaskEvents
      tags: [tasks]
      summary: List change events for a task
      description: >
        Returns the full audit trail for a task: one event per field change,
        ordered by creation date ascending (oldest first). Includes a synthetic
        "created" event emitted when the task was first inserted. The task must
        belong to the caller's organization; returns 404 if not found.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the task whose events to list.
          schema:
            type: integer
      responses:
        "200":
          description: List of task events ordered oldest-first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskEvent"
        "404":
          description: Task not found or belongs to a different org.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

  /comments/{id}:
    delete:
      operationId: deleteComment
      tags: [comments]
      summary: Delete a comment
      description: >
        Permanently deletes a comment by its numeric ID. Only the comment's
        original author or an org admin (manage_org_settings permission) may
        delete a comment. Returns 404 if the comment is not found or belongs to
        a different org. Returns 403 if the caller is neither the author nor an
        org admin. Returns 204 on success.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the comment to delete.
          schema:
            type: integer
      responses:
        "204":
          description: Comment deleted successfully. No body returned.
        "403":
          description: >
            The caller is not the comment author and does not have org admin
            (manage_org_settings) permission.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

  /views:
    get:
      operationId: listViews
      tags: [views]
      summary: List saved views for the current user
      description: >
        Returns saved views visible to the caller: their own personal views plus
        all org-wide views within their organization.
      responses:
        "200":
          description: List of saved views
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedView"
    post:
      operationId: createView
      tags: [views]
      summary: Create a saved view
      description: >
        Creates a new saved view for the caller. The view stores the current
        filter state. If `isDefault` is true, any previous default view for this
        user is automatically unset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedViewInput"
      responses:
        "201":
          description: Created saved view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedView"
        "400":
          description: Invalid request body.

  /views/{id}:
    patch:
      operationId: updateView
      tags: [views]
      summary: Update a saved view
      description: >
        Renames a view, changes its visibility, or sets it as the default.
        Only the view's creator or an org admin may update it. Setting
        `isDefault: true` automatically clears any previous default view for
        the caller.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Numeric ID of the saved view.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedViewUpdate"
      responses:
        "200":
          description: Updated saved view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedView"
        "400":
          description: Invalid request body.
        "403":
          description: Not the view owner or an org admin.
        "404":
          description: View not found.
    delete:
      operationId: deleteView
      tags: [views]
      summary: Delete a saved view
      description: >
        Permanently deletes a saved view. Only the view's creator or an org
        admin may delete it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Numeric ID of the saved view to delete.
      responses:
        "204":
          description: View deleted successfully.
        "403":
          description: Not the view owner or an org admin.
        "404":
          description: View not found.

  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List all notes, optionally filtered by project or task
      description: >
        Returns notes visible to the caller within their organization. Visibility
        rules: the caller always sees their own notes and legacy notes with no
        owner; `public_read` and `public_write` notes from other org members are
        also returned. Private notes owned by other members are excluded. Results
        are ordered by `updatedAt` descending. Optionally filter to a specific
        project or task using query parameters.
      parameters:
        - name: projectId
          in: query
          required: false
          description: Return only notes linked to this project ID.
          schema:
            type: integer
        - name: taskId
          in: query
          required: false
          description: Return only notes linked to this task ID.
          schema:
            type: integer
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a new note
      description: >
        Creates a new note scoped to the caller's organization. The `createdBy`
        field is set automatically to the authenticated user. If `projectId` or
        `taskId` are supplied they must belong to the same org, otherwise a 400
        is returned. Notes default to `private` visibility if no `visibility` is
        specified.
      requestBody:
        required: true
        description: Note content and optional project/task association.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"

  /notes/{id}:
    get:
      operationId: getNote
      tags: [notes]
      summary: Get a note by ID
      description: >
        Retrieves a single note by numeric ID within the caller's organization.
        Returns 404 if the note does not exist or belongs to a different org.
        Returns 403 if the note exists but is `private` and owned by another
        user.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the note.
          schema:
            type: integer
      responses:
        "200":
          description: Note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          description: Note not found or does not belong to the caller's organization.
        "403":
          description: Note is private and owned by another user.
    patch:
      operationId: updateNote
      tags: [notes]
      summary: Update a note
      description: >
        Partially updates a note. Owners may change any field including
        `visibility`. Non-owners may edit content on `public_write` notes but
        cannot change `visibility` (returns 403). Non-owners cannot edit
        `private` or `public_read` notes (returns 403). If `projectId` or
        `taskId` are changed they must belong to the same org. Returns 404 if
        the note is not found.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the note to update.
          schema:
            type: integer
      requestBody:
        required: true
        description: Partial set of note fields to update. All fields are optional.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteUpdate"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "403":
          description: >
            Non-owner trying to edit a non-public_write note, or attempting
            to change visibility without ownership.
        "404":
          description: Note not found or does not belong to the caller's organization.
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note
      description: >
        Permanently deletes a note. Only the note owner can delete it; other
        org members receive a 403. Returns 404 if the note does not exist or
        belongs to a different org.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the note to delete.
          schema:
            type: integer
      responses:
        "204":
          description: Note deleted successfully. No body returned.
        "403":
          description: Only the note owner can delete this note.
        "404":
          description: Note not found or does not belong to the caller's organization.

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      description: >
        Returns aggregated statistics for the caller's organization in a single
        query: total task and project counts, task counts broken down by status
        and by priority, the number of overdue tasks (past due date and not
        `done`), and the number of currently active projects. Scoped strictly to
        the caller's org.
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      description: >
        Returns up to 10 recent activity events for the caller's organization,
        sorted by `createdAt` descending. Events are sourced from the 5 most
        recently created tasks, the 5 most recently added comments, and the 5
        most recently created projects, then merged and truncated. Each item
        carries a `type` (`task_created`, `comment_added`, or
        `project_created`), a human-readable `title`, and the `entityId` /
        `entityType` of the affected object.
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/sla-summary:
    get:
      operationId: getDashboardSlaSummary
      tags: [dashboard]
      summary: Get SLA compliance summary for the dashboard
      description: >
        Returns SLA compliance metrics for the caller's organization. Tracks
        tasks that had an SLA policy applied: those resolved without breaching
        (`slaBreachedAt` is null, in a closed stage) and those that did breach
        (`slaBreachedAt` is not null). Also returns average breach overshoot in
        minutes and a per-priority breakdown. Scoped strictly to the caller's org.
      parameters:
        - name: period
          in: query
          required: false
          description: >
            Time window to compute stats over, relative to today. One of `7d`,
            `30d`, `90d`, or `all`. Defaults to `30d`.
          schema:
            type: string
            enum: [7d, 30d, 90d, all]
            default: 30d
      responses:
        "200":
          description: SLA compliance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlaSummary"

  /search:
    get:
      operationId: globalSearch
      tags: [search]
      summary: Global search across tasks, projects, and notes
      description: >
        Runs parallel ILIKE prefix queries on task titles, project names, and
        note titles/content. All results are scoped to the caller's organization.
        Returns up to `limit` results per entity type (default 5, max 20).
        Returns 400 if `q` is missing or blank.
      parameters:
        - name: q
          in: query
          required: true
          description: Search query string (1–200 characters).
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: limit
          in: query
          required: false
          description: Maximum results per entity type (1–20, default 5).
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        "200":
          description: Search results grouped by entity type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          description: Missing or invalid query parameter.

  /tasks/bulk:
    patch:
      operationId: bulkUpdateTasks
      tags: [tasks]
      summary: Bulk update multiple tasks
      description: >
        Partially updates one or more fields across a set of tasks. All
        supplied `ids` must belong to the caller's organization — any that
        don't are silently skipped. Requires the `edit_tasks` permission.
        Inserts one audit event per changed field per task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTaskPatchInput"
      responses:
        "200":
          description: Number of tasks successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkTaskPatchResult"
        "400":
          description: Validation error.
        "403":
          description: Missing edit_tasks permission.
    delete:
      operationId: bulkDeleteTasks
      tags: [tasks]
      summary: Bulk delete multiple tasks
      description: >
        Permanently deletes a set of tasks and their comments. All supplied
        `ids` must belong to the caller's organization — any that don't are
        silently skipped. Requires the `delete_tasks` permission (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTaskDeleteInput"
      responses:
        "200":
          description: Number of tasks successfully deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkTaskDeleteResult"
        "403":
          description: Missing delete_tasks permission.

  /tasks/overdue:
    get:
      operationId: getOverdueTasks
      tags: [tasks]
      summary: Get all overdue tasks
      description: >
        Returns all tasks in the caller's organization whose `dueDate` is
        strictly before today and whose `status` is not `done`, ordered by
        `dueDate` ascending (most overdue first). Enriched the same way as the
        general task list (project name, comment count).
      responses:
        "200":
          description: Overdue tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  /custom-fields:
    get:
      operationId: listCustomFieldDefinitions
      tags: [custom-fields]
      summary: List custom field definitions for the org
      description: >
        Returns custom field definitions for the caller's organization, ordered
        by `position` then `id`. By default only active (non-deleted) definitions
        are returned. Pass `includeSoftDeleted=true` to also receive soft-deleted
        definitions (identified by a non-null `deletedAt`). Available to all org
        members.
      parameters:
        - name: includeSoftDeleted
          in: query
          required: false
          description: >
            When `true`, soft-deleted field definitions are included in the
            response alongside active ones. Defaults to `false`.
          schema:
            type: boolean
      responses:
        "200":
          description: List of custom field definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomFieldDefinition"
    post:
      operationId: createCustomFieldDefinition
      tags: [custom-fields]
      summary: Create a custom field definition (admin only)
      description: >
        Creates a new custom field definition for the org. Position is
        automatically assigned as the next available slot. Requires `admin` role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomFieldDefinitionInput"
      responses:
        "201":
          description: Created custom field definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomFieldDefinition"
        "400":
          description: Invalid request body.
        "403":
          description: Admin access required.

  /custom-fields/reorder:
    post:
      operationId: reorderCustomFieldDefinitions
      tags: [custom-fields]
      summary: Reorder custom field definitions (admin only)
      description: >
        Accepts an ordered array of field definition IDs and reassigns
        `position` values to match the provided order. Requires `admin` role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomFieldReorderInput"
      responses:
        "204":
          description: Reorder applied successfully.
        "400":
          description: Invalid request body.
        "403":
          description: Admin access required.

  /custom-fields/{id}/restore:
    post:
      operationId: restoreCustomFieldDefinition
      tags: [custom-fields]
      summary: Restore a soft-deleted custom field definition (admin only)
      description: >
        Clears the `deletedAt` timestamp on a soft-deleted field definition,
        making it active again. Task data stored under the field is
        unaffected — it was preserved by the soft-delete. Returns 404 if the
        field does not exist in the org or is already active. Requires
        `admin` role.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored field definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomFieldDefinition"
        "403":
          description: Admin access required.
        "404":
          description: Custom field not found, belongs to a different org, or is already active.

  /custom-fields/{id}/purge:
    post:
      operationId: purgeCustomFieldDefinition
      tags: [custom-fields]
      summary: Hard-delete a custom field and erase all stored values (admin only)
      description: >
        Permanently deletes the field definition row and removes its key from
        every task's `customFields` JSONB column in a single transaction.
        Works on both active and soft-deleted field definitions. Returns the
        number of tasks whose data was erased. This action is irreversible.
        Requires `admin` role.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Field and all its data permanently erased.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomFieldPurgeResult"
        "403":
          description: Admin access required.
        "404":
          description: Custom field not found or belongs to a different org.

  /custom-fields/{id}:
    patch:
      operationId: updateCustomFieldDefinition
      tags: [custom-fields]
      summary: Update a custom field definition (admin only)
      description: >
        Renames a field or updates its options list. Type cannot be changed
        after creation. Requires `admin` role.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomFieldDefinitionUpdate"
      responses:
        "200":
          description: Updated custom field definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomFieldDefinition"
        "400":
          description: Invalid request body.
        "403":
          description: Admin access required.
        "404":
          description: Custom field not found or already deleted.
        "409":
          description: >
            One or more options being removed are still stored in existing task
            records. Retry with `force: true` in the request body to clear those
            values automatically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomFieldOptionConflict"
    delete:
      operationId: deleteCustomFieldDefinition
      tags: [custom-fields]
      summary: Soft-delete a custom field definition (admin only)
      description: >
        Soft-deletes the field definition. Existing task data is preserved in
        the `customFields` JSONB column but the field will no longer appear in
        the UI. Requires `admin` role.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Field soft-deleted successfully.
        "403":
          description: Admin access required.
        "404":
          description: Custom field not found or already deleted.

  /orgs:
    post:
      operationId: createOrg
      tags: [orgs]
      summary: Create a new organization (caller becomes admin)
      description: >
        Creates a new organization and automatically adds the authenticated user
        as its first `admin` member. Returns 409 if the caller already belongs
        to an organization (each user may belong to at most one org). Returns
        400 if `name` is missing or empty.
      requestBody:
        required: true
        description: Organization display name (1–200 characters).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgInput"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMeResponse"
        "409":
          description: Caller already belongs to an organization.

  /orgs/me:
    patch:
      operationId: renameOrg
      tags: [orgs]
      summary: Rename the current organization (admin only)
      description: >
        Updates the display name of the caller's organization. Requires `admin`
        role; returns 403 for non-admins. Returns 400 if `name` is empty or
        exceeds 200 characters.
      requestBody:
        required: true
        description: New organization name (1–200 characters).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameOrgInput"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          description: Invalid input - name missing or too long.
        "403":
          description: Caller is not an admin of the organization.
    get:
      operationId: getMyOrg
      tags: [orgs]
      summary: Get current org membership, role, and any pending invitation
      description: >
        Returns the caller's org context: their current organization and role if
        they are a member, or the oldest non-expired pending invitation targeted
        at their user ID or email if they are not. When neither condition
        applies, all three fields (`org`, `role`, `pendingInvitation`) are
        `null`. Useful for bootstrapping the UI on first load.
      responses:
        "200":
          description: Current org context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMeResponse"

  /orgs/terminology:
    get:
      operationId: getOrgTerminology
      tags: [orgs]
      summary: Get the resolved terminology map for the current org
      description: >
        Returns all five terminology keys with their current custom labels (or
        defaults if no override has been set). Available to any authenticated
        org member.
      responses:
        "200":
          description: Resolved terminology map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgTerminologyMap"
        "401":
          description: Not authenticated.
        "403":
          description: Caller is not a member of any org.
    patch:
      operationId: patchOrgTerminology
      tags: [orgs]
      summary: Update org terminology labels
      description: >
        Upserts custom labels for one or more of the five terminology keys.
        Requires the `manage_terminology` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchOrgTerminologyBody"
      responses:
        "200":
          description: Updated resolved terminology map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgTerminologyMap"
        "400":
          description: Invalid input — a label is empty or exceeds 50 characters.
        "403":
          description: Caller lacks the manage_terminology permission.

  /orgs/members:
    get:
      operationId: listOrgMembers
      tags: [orgs]
      summary: List all members of the current organization
      description: >
        Returns all members of the caller's organization with their profile
        information, ordered by join date ascending. Requires org membership;
        both `admin` and `member` roles can call this endpoint.
      responses:
        "200":
          description: Member list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgMemberInfo"

  /orgs/invite:
    post:
      operationId: inviteOrgMember
      tags: [orgs]
      summary: Invite a user to the organization (admin only)
      description: >
        Creates a pending invitation valid for 7 days. Either `email` or
        `userId` must be provided; providing both is allowed. Returns 409 if
        the target user is already a member of the org. The invitation can be
        accepted via `/orgs/invitations/{token}/accept` by any authenticated
        user whose email or userId matches the invitation. Requires `admin`
        role.
      requestBody:
        required: true
        description: Target user's email address, userId, or both.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationInfo"

  /orgs/invitation-preview/{token}:
    get:
      operationId: getInvitationPreview
      tags: [orgs]
      summary: Get public preview info for an invitation token (no auth required)
      description: >
        Returns the organization name and expiry date for a pending, non-expired
        invitation token without requiring authentication. Used to render the
        "You've been invited to join {orgName}" page before the user logs in.
        Returns 404 if the token is not found, already accepted/declined, or
        expired.
      parameters:
        - name: token
          in: path
          required: true
          description: Opaque invitation token from the invitation email or link.
          schema:
            type: string
      responses:
        "200":
          description: Invitation preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "404":
          description: Invitation not found or expired.

  /orgs/invitations:
    get:
      operationId: listOrgInvitations
      tags: [orgs]
      summary: List pending invitations for the current organization (admin only)
      description: >
        Returns all non-expired, pending invitations for the caller's
        organization, ordered by creation date ascending. Requires `admin` role;
        returns 403 for non-admins.
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvitationInfo"
        "403":
          description: Caller is not an admin of the organization.

  /orgs/invitations/{id}:
    delete:
      operationId: cancelOrgInvitation
      tags: [orgs]
      summary: Cancel a pending invitation (admin only)
      description: >
        Permanently deletes a pending invitation by its UUID. Requires `admin`
        role. Returns 404 if the invitation does not exist, belongs to a
        different org, or is no longer pending. Returns 403 for non-admins.
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the invitation to cancel.
          schema:
            type: string
      responses:
        "204":
          description: Invitation cancelled successfully. No body returned.
        "403":
          description: Caller is not an admin of the organization.
        "404":
          description: Invitation not found or not pending.

  /orgs/invitations/{token}/accept:
    post:
      operationId: acceptOrgInvitation
      tags: [orgs]
      summary: Accept a pending invitation
      description: >
        Accepts the invitation identified by `token`, adds the caller to the
        organization as a `member`, and marks the invitation as `accepted`.
        Returns 404 if the token is not found, expired, or no longer pending.
        Returns 403 if the invitation is not addressed to the caller (checked by
        matching the caller's userId and email against `invitedUserId` and
        `invitedEmail`). Returns 409 if the caller already belongs to an
        organization.
      parameters:
        - name: token
          in: path
          required: true
          description: Opaque invitation token to accept.
          schema:
            type: string
      responses:
        "200":
          description: Invitation accepted, org membership returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMeResponse"
        "403":
          description: Invitation is not addressed to the authenticated user.
        "404":
          description: Invitation not found or expired.
        "409":
          description: Caller already belongs to an organization.

  /orgs/invitations/{token}/decline:
    post:
      operationId: declineOrgInvitation
      tags: [orgs]
      summary: Decline a pending invitation
      description: >
        Marks the invitation as `declined`. Returns 404 if the token is not
        found. Returns 403 if the invitation is not addressed to the caller.
        The caller does not need to be a member of any org to call this
        endpoint.
      parameters:
        - name: token
          in: path
          required: true
          description: Opaque invitation token to decline.
          schema:
            type: string
      responses:
        "200":
          description: Invitation declined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleSuccess"
        "403":
          description: Invitation is not addressed to the authenticated user.
        "404":
          description: Invitation not found.

  /orgs/members/{userId}:
    delete:
      operationId: removeOrgMember
      tags: [orgs]
      summary: Remove a member from the organization (admin only)
      description: >
        Removes the specified user from the caller's organization. Requires
        `admin` role. Returns 400 if the caller attempts to remove themselves.
        Returns 404 if the target user is not a member of the org.
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of the user to remove from the organization.
          schema:
            type: string
      responses:
        "204":
          description: Member removed successfully. No body returned.
        "400":
          description: Cannot remove yourself from the organization.
        "403":
          description: Caller is not an admin of the organization.
        "404":
          description: Target user is not a member of this organization.

  /orgs/members/{userId}/role:
    patch:
      operationId: updateOrgMemberRole
      tags: [orgs]
      summary: Assign a role to a member (manage_members permission required)
      description: >
        Assigns a role to an org member. The caller must have the
        `manage_members` permission. Only owners can assign the Owner built-in
        role. Returns 404 if the target user or role is not found in this org.
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of the member whose role to change.
          schema:
            type: string
      requestBody:
        required: true
        description: New role for the member.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRoleInput"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMemberInfo"
        "403":
          description: Caller lacks manage_members permission, or tried to assign Owner role without being an owner.
        "404":
          description: Target user or role not found in this organization.

  /workflow-stages:
    get:
      operationId: listWorkflowStages
      tags: [workflow-stages]
      summary: List workflow stages for the current org
      description: >
        Returns all workflow stages for the org ordered by position, then ID.
        Active stages come first; archived stages are included for display purposes.
        Available to all org members.
      responses:
        "200":
          description: Array of workflow stages.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowStage"
    post:
      operationId: createWorkflowStage
      tags: [workflow-stages]
      summary: Create a workflow stage (admin only)
      description: >
        Creates a new workflow stage appended at the end of the position list.
        Requires the `manage_workflow_stages` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowStageInput"
      responses:
        "201":
          description: Created workflow stage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowStage"
        "400":
          description: Invalid input.
        "403":
          description: Permission required.

  /workflow-stages/reorder:
    post:
      operationId: reorderWorkflowStages
      tags: [workflow-stages]
      summary: Reorder workflow stages (admin only)
      description: >
        Accepts an ordered array of stage IDs and reassigns `position` values
        to match. Requires the `manage_workflow_stages` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowStageReorderInput"
      responses:
        "204":
          description: Reordered.
        "400":
          description: Invalid input.
        "403":
          description: Permission required.

  /workflow-stages/{id}:
    patch:
      operationId: updateWorkflowStage
      tags: [workflow-stages]
      summary: Update a workflow stage (admin only)
      description: >
        Partially updates a stage: rename, recolor, change type, archive, or
        restore. Requires the `manage_workflow_stages` permission. The org must
        always retain at least one active `open` and one active `closed` stage.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowStageUpdate"
      responses:
        "200":
          description: Updated workflow stage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowStage"
        "400":
          description: Invalid input.
        "403":
          description: Permission required.
        "404":
          description: Stage not found.
        "409":
          description: Constraint violation (e.g. would leave org with no open or closed stages).
    delete:
      operationId: removeWorkflowStage
      tags: [workflow-stages]
      summary: Delete a workflow stage (admin only)
      description: >
        Permanently deletes a stage. If tasks currently use this stage, provide
        the `reassignTo` query parameter with a target stage ID; all affected
        tasks are reassigned before deletion. Returns 409 if tasks exist and no
        reassignment target is provided. Requires the `manage_workflow_stages`
        permission.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: reassignTo
          in: query
          required: false
          schema:
            type: integer
          description: Stage ID to reassign existing tasks to before deleting this stage.
      responses:
        "204":
          description: Stage deleted.
        "400":
          description: Invalid reassignTo stage.
        "403":
          description: Permission required.
        "404":
          description: Stage not found.
        "409":
          description: Tasks exist in this stage and no reassignTo was provided.

  /api-keys:
    get:
      operationId: listApiKeys
      tags: [api-keys]
      summary: List API keys for the org (admin only)
      description: Returns metadata for all API keys in the org. The raw key value is never returned after creation.
      responses:
        "200":
          description: Array of API key metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        "401":
          description: Not authenticated.
        "403":
          description: manage_api_keys permission required.
    post:
      operationId: createApiKey
      tags: [api-keys]
      summary: Create a new API key (admin only)
      description: Generates a new API key and returns the full key value exactly once. Store it securely — it cannot be retrieved again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyInput"
      responses:
        "201":
          description: Created API key with the full key value (shown once).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "400":
          description: Invalid input.
        "403":
          description: manage_api_keys permission required.

  /api-keys/{id}:
    delete:
      operationId: revokeApiKey
      tags: [api-keys]
      summary: Revoke an API key (admin only)
      description: Immediately revokes the key. All requests using this key will be rejected.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked API key metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "403":
          description: manage_api_keys permission required.
        "404":
          description: Key not found.
        "409":
          description: Key already revoked.

  /task-templates:
    get:
      operationId: listTaskTemplates
      tags: [tasks]
      summary: List task templates for the current org
      description: Returns all task templates for the org, ordered by creation date.
      responses:
        "200":
          description: Array of task templates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskTemplate"
    post:
      operationId: createTaskTemplate
      tags: [tasks]
      summary: Create a task template (admin only)
      description: Creates a new task template for the org. Requires manage_task_templates permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskTemplateInput"
      responses:
        "201":
          description: Created task template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTemplate"
        "400":
          description: Invalid input.
        "403":
          description: Admin permission required.

  /task-templates/{id}:
    patch:
      operationId: updateTaskTemplate
      tags: [tasks]
      summary: Update a task template (admin only)
      description: Updates name or default field values on an existing template. Requires manage_task_templates permission.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskTemplateUpdate"
      responses:
        "200":
          description: Updated task template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTemplate"
        "400":
          description: Invalid input.
        "403":
          description: Admin permission required.
        "404":
          description: Template not found.
    delete:
      operationId: deleteTaskTemplate
      tags: [tasks]
      summary: Delete a task template (admin only)
      description: Permanently deletes a task template. Requires manage_task_templates permission.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Template deleted.
        "403":
          description: Admin permission required.
        "404":
          description: Template not found.

  /projects/{projectId}/sla-policies:
    get:
      operationId: getProjectSLAPolicies
      tags: [projects]
      summary: Get project-level SLA policy overrides
      description: >
        Returns SLA policy overrides configured for this specific project.
        Only project-level overrides are returned; org-level defaults are not included.
        Omitted priorities fall back to the org-level policy.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Array of project-level SLA policy overrides.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SlaPolicy"
        "404":
          description: Project not found.
    put:
      operationId: upsertProjectSLAPolicies
      tags: [projects]
      summary: Set project-level SLA policy overrides (admin only)
      description: >
        Replaces all project-level SLA policy overrides for this project.
        Send an empty policies array to clear all overrides and revert to org defaults.
        Requires manage_sla_policies permission.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SLAPoliciesInput"
      responses:
        "200":
          description: Updated project-level SLA policies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SlaPolicy"
        "400":
          description: Invalid input.
        "403":
          description: Permission required.
        "404":
          description: Project not found.

  /org/sla-policies:
    get:
      operationId: getSLAPolicies
      tags: [orgs]
      summary: Get SLA policies for the current org
      description: >
        Returns the SLA response and resolution targets for each priority level.
        Priorities with no configured policy are omitted from the response.
      responses:
        "200":
          description: Array of SLA policies for this org.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SlaPolicy"
    put:
      operationId: upsertSLAPolicies
      tags: [orgs]
      summary: Set SLA policies for the current org (admin only)
      description: >
        Replaces all SLA policies for the org. Accepts up to four entries (one
        per priority). Omitted priorities are cleared. Requires admin permissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SLAPoliciesInput"
      responses:
        "200":
          description: Updated SLA policies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SlaPolicy"
        "400":
          description: Invalid input.
        "403":
          description: Admin permission required.

  /orgs/leave:
    post:
      operationId: leaveOrg
      tags: [orgs]
      summary: Leave the current organization
      description: >
        Removes the authenticated user from their current organization. The
        caller's tasks and projects remain in the org but become unassigned.
        If the departing user is the sole Owner, they must transfer the Owner
        role to another member before leaving.
      responses:
        "200":
          description: Left organization successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleSuccess"

  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: List all roles for the current org
      description: >
        Returns all roles defined for the caller's organization — three
        built-in roles (Owner, Admin, Member) plus any custom roles created
        by owners. Built-in roles appear first in a fixed order.
      responses:
        "200":
          description: Array of roles ordered built-in first, then custom alphabetically.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      operationId: createRole
      tags: [roles]
      summary: Create a custom role (owner only)
      description: >
        Creates a new custom role for the org. Requires Owner role. The new
        role's permissions default to the Member preset for any key not supplied
        in the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleInput"
      responses:
        "201":
          description: Role created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "403":
          description: Caller is not an Owner.
        "409":
          description: A role with that name already exists in this org.

  /roles/{id}:
    patch:
      operationId: updateRole
      tags: [roles]
      summary: Update a role's name and/or permissions (owner only)
      description: >
        Updates a role's display name and/or permission flags. Only provided
        fields are changed. The Owner built-in role cannot be modified.
        Requires Owner role.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleInput"
      responses:
        "200":
          description: Updated role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "403":
          description: Caller is not an Owner, or the role is the immutable Owner role.
        "404":
          description: Role not found.
        "409":
          description: A role with that name already exists.
    delete:
      operationId: deleteRole
      tags: [roles]
      summary: Delete a custom role (owner only)
      description: >
        Permanently deletes a custom role. All members currently assigned to
        this role are automatically reassigned to the Member built-in role.
        Built-in roles (Owner, Admin, Member) cannot be deleted. Requires Owner
        role.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Role deleted; affected members reassigned to Member role.
        "403":
          description: Caller is not an Owner, or the role is a built-in role.
        "404":
          description: Role not found.

  /webhooks/inbound/{token}/ingest:
    post:
      tags: [webhooks]
      operationId: ingestWebhookPayload
      summary: Ingest an external payload and create a task (public)
      description: >
        Public endpoint — no session required. Validates the HMAC-SHA256
        signature in `X-Opsly-Signature` (keyed on the webhook token), applies
        the webhook's task template to the payload, and creates a task in the
        webhook's org. Returns 401 on bad/missing signature, 403 if disabled.
      parameters:
        - name: token
          in: path
          required: true
          description: 64-character hex token embedded in the webhook URL.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookIngestPayload'
      responses:
        '201':
          description: Task created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookIngestSuccess'
        '400':
          description: Invalid payload.
        '401':
          description: Missing or invalid HMAC signature.
        '403':
          description: Webhook is disabled.
        '404':
          description: Webhook not found.

  /webhooks/inbound:
    get:
      tags: [webhooks]
      operationId: listInboundWebhooks
      summary: List inbound webhooks visible to the caller
      responses:
        '200':
          description: List of inbound webhooks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InboundWebhook'
    post:
      tags: [webhooks]
      operationId: createInboundWebhook
      summary: Create an inbound webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundWebhookInput'
      responses:
        '201':
          description: Inbound webhook created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundWebhook'

  /webhooks/inbound/{id}:
    get:
      tags: [webhooks]
      operationId: getInboundWebhook
      summary: Get an inbound webhook by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Inbound webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundWebhook'
        '404':
          description: Not found.
    patch:
      tags: [webhooks]
      operationId: updateInboundWebhook
      summary: Update an inbound webhook (creator only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundWebhookUpdate'
      responses:
        '200':
          description: Updated webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundWebhook'
        '403':
          description: Not the creator.
        '404':
          description: Not found.
    delete:
      tags: [webhooks]
      operationId: deleteInboundWebhook
      summary: Delete an inbound webhook (creator only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted.
        '403':
          description: Not the creator.
        '404':
          description: Not found.

  /webhooks/inbound/{id}/rotate-secret:
    post:
      tags: [webhooks]
      operationId: rotateInboundWebhookSecret
      summary: Rotate the token/secret for an inbound webhook (creator only)
      description: >
        Issues a new 64-character hex token and returns the updated webhook.
        The old ingest URL is immediately invalidated.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated webhook with new token and ingest URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundWebhook'
        '403':
          description: Not the creator.
        '404':
          description: Not found.

  /webhooks/outbound:
    get:
      tags: [webhooks]
      operationId: listOutboundWebhooks
      summary: List outbound webhooks visible to the caller
      responses:
        '200':
          description: List of outbound webhooks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutboundWebhook'
    post:
      tags: [webhooks]
      operationId: createOutboundWebhook
      summary: Create an outbound webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundWebhookInput'
      responses:
        '201':
          description: Outbound webhook created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundWebhook'

  /webhooks/outbound/{id}/deliveries:
    get:
      tags: [webhooks]
      operationId: listOutboundWebhookDeliveries
      summary: List the 25 most recent deliveries for an outbound webhook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Recent delivery attempts, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutboundWebhookDelivery'
        '404':
          description: Webhook not found.

  /webhooks/outbound/{id}:
    get:
      tags: [webhooks]
      operationId: getOutboundWebhook
      summary: Get an outbound webhook by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Outbound webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundWebhook'
        '404':
          description: Not found.
    patch:
      tags: [webhooks]
      operationId: updateOutboundWebhook
      summary: Update an outbound webhook (creator only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundWebhookUpdate'
      responses:
        '200':
          description: Updated webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundWebhook'
        '403':
          description: Not the creator.
        '404':
          description: Not found.
    delete:
      tags: [webhooks]
      operationId: deleteOutboundWebhook
      summary: Delete an outbound webhook (creator only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted.
        '403':
          description: Not the creator.
        '404':
          description: Not found.

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: >
        Opaque session token in the form `Bearer <sid>`. Used by mobile clients
        in place of the session cookie. Passed to the session middleware which
        resolves the user; ignored if no matching session exists.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: >
        Browser session cookie set by the `/login` callback. The session
        middleware reads this cookie to resolve the authenticated user.
      schema:
        type: string
  schemas:
    AuthUser:
      description: Profile of the currently authenticated user as stored in the session.
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
          description: Unique user ID from the OIDC provider (`sub` claim).
        email:
          type: [string, 'null']
          description: User's email address. May be null if the provider did not supply one.
        firstName:
          type: [string, 'null']
          description: User's given name. Null if not provided by the OIDC provider.
        lastName:
          type: [string, 'null']
          description: User's family name. Null if not provided by the OIDC provider.
        profileImageUrl:
          type: [string, 'null']
          description: URL of the user's profile picture. Null if not provided.
    AuthUserEnvelope:
      description: >
        Wrapper returned by `GET /auth/user`. The `user` field is null when no
        valid session exists.
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      description: >
        OIDC authorization code and associated PKCE parameters captured by the
        mobile app after the user completes the in-app browser login flow.
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
          description: Authorization code returned by the OIDC provider.
        code_verifier:
          type: string
          minLength: 1
          description: PKCE code verifier that was used to generate the code challenge.
        redirect_uri:
          type: string
          minLength: 1
          description: Redirect URI registered with the OIDC provider for this flow.
        state:
          type: string
          minLength: 1
          description: Opaque state value used for CSRF protection during the flow.
        nonce:
          type: string
          minLength: 1
          description: Optional nonce included in the authorization request for replay protection.
    MobileTokenExchangeSuccess:
      description: Successful mobile token exchange response containing the opaque session token.
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: >
            Opaque session ID (`sid`). Include this in the `Authorization:
            Bearer <token>` header on all subsequent authenticated requests.
    LogoutSuccess:
      description: Confirms a successful logout operation.
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
          description: Always `true` when the logout request was processed.
    ErrorEnvelope:
      description: Standard error response body returned on 4xx and 5xx responses.
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message describing what went wrong.
    HealthStatus:
      description: Server health status payload.
      type: object
      properties:
        status:
          type: string
          description: >
            Health status string. Returns `"ok"` when the server is healthy.
      required:
        - status

    Project:
      description: An IT project grouping related tasks within an organization.
      type: object
      required: [id, name, status, priority, createdAt, updatedAt]
      properties:
        id:
          type: integer
          description: Auto-incremented primary key.
        name:
          type: string
          description: Human-readable project name.
        description:
          type: ["string", "null"]
          description: Optional longer description of the project's scope and goals.
        status:
          type: string
          enum: [planning, active, on_hold, completed]
          description: >
            Lifecycle status of the project. `planning` - not yet started;
            `active` - work is ongoing; `on_hold` - temporarily paused;
            `completed` - all work finished.
        priority:
          type: string
          enum: [low, medium, high, critical]
          description: >
            Importance level of the project. `critical` projects should be
            addressed immediately; `low` can be deferred.
        dueDate:
          type: ["string", "null"]
          description: Target completion date in `YYYY-MM-DD` format. Null if no deadline is set.
        taskCount:
          type: integer
          description: Total number of tasks linked to this project within the org.
        completedTaskCount:
          type: integer
          description: Number of tasks linked to this project with status `done`.
        hasSlaOverrides:
          type: boolean
          description: True when the project has at least one project-level SLA policy override active. False or absent means the project uses org defaults.
        createdAt:
          type: string
          description: ISO 8601 timestamp when the project was created.
        updatedAt:
          type: string
          description: ISO 8601 timestamp when the project was last updated.

    ProjectInput:
      description: Fields required to create a new project.
      type: object
      required: [name, status, priority]
      properties:
        name:
          type: string
          minLength: 1
          description: Display name of the project (must be non-empty).
        description:
          type: string
          description: Optional description of the project's scope and goals.
        status:
          type: string
          enum: [planning, active, on_hold, completed]
          description: Initial lifecycle status of the project.
        priority:
          type: string
          enum: [low, medium, high, critical]
          description: Importance level of the project.
        dueDate:
          type: string
          description: Target completion date in `YYYY-MM-DD` format.

    ProjectUpdate:
      description: Partial update for an existing project. All fields are optional.
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: New display name for the project.
        description:
          type: string
          description: Updated description.
        status:
          type: string
          enum: [planning, active, on_hold, completed]
          description: New lifecycle status.
        priority:
          type: string
          enum: [low, medium, high, critical]
          description: New priority level.
        dueDate:
          type: string
          description: New target completion date in `YYYY-MM-DD` format.

    Task:
      description: >
        An individual work item within an organization, optionally linked to a
        project. Enriched with the project name, number of comments, and the
        org's active workflow stage details.
      type: object
      required: [id, orgTaskNumber, title, status, priority, category, createdAt, updatedAt]
      properties:
        id:
          type: integer
          description: Auto-incremented primary key.
        orgTaskNumber:
          type: integer
          description: >
            Per-organization sequential task number. Starts at 1 for each org
            and increments with each new task. Used to display the TSK-## badge.
            Unique within an org but not globally unique.
        projectId:
          type: ["integer", "null"]
          description: ID of the linked project. Null if the task is not associated with a project.
        projectName:
          type: ["string", "null"]
          description: >
            Display name of the linked project, resolved at query time and
            scoped to the org. Null if no project is linked or the project
            belongs to another org.
        title:
          type: string
          description: Short, descriptive title of the task.
        description:
          type: ["string", "null"]
          description: Optional detailed description of the work to be done.
        status:
          type: string
          description: >
            Numeric ID of the task's current workflow stage, stored as a string.
            Use `stageName` for display and `stageType` for open/closed logic.
        stageId:
          type: integer
          description: Numeric ID of the workflow stage. Matches `status` parsed as integer.
        stageName:
          type: string
          description: Display name of the current workflow stage (e.g. "In Progress").
        stageColor:
          type: string
          description: Hex color of the current workflow stage (e.g. "#f59e0b").
        stageType:
          type: string
          enum: [open, closed]
          description: >
            Stage type. `open` — task is unresolved; `closed` — task is resolved.
            Used for SLA tracking and dashboard counts.
        stageArchived:
          type: boolean
          description: Whether the current stage is archived. Archived tasks should be shown with an indicator.
        priority:
          type: string
          enum: [low, medium, high, critical]
          description: >
            Urgency of the task. `critical` tasks require immediate attention;
            `low` tasks can be deferred.
        category:
          type: string
          enum: [incident, change, maintenance, deployment, support, other]
          description: >
            IT operational category. `incident` - unplanned disruption;
            `change` - planned modification; `maintenance` - routine upkeep;
            `deployment` - software release; `support` - user-facing assistance;
            `other` - anything that doesn't fit.
        assignee:
          type: ["string", "null"]
          description: >
            Email address of the org member assigned to this task. Must match
            a current org member when set. Null if unassigned.
        dueDate:
          type: ["string", "null"]
          description: Task deadline in `YYYY-MM-DD` format. Null if no deadline is set.
        commentCount:
          type: integer
          description: Number of comments attached to this task.
        customFields:
          type: object
          additionalProperties: true
          description: >
            JSONB bag of custom field values keyed by field definition ID.
            Values are type-dependent: string for text/date/single_select,
            number for number, array of strings for multi_select.
        createdAt:
          type: string
          description: ISO 8601 timestamp when the task was created.
        updatedAt:
          type: string
          description: ISO 8601 timestamp when the task was last updated.
        slaBreachedAt:
          type: ["string", "null"]
          description: ISO 8601 timestamp when a resolution SLA breach was first detected. Null until a breach occurs.

    TaskInput:
      description: Fields required to create a new task.
      type: object
      required: [title, status, priority, category]
      properties:
        projectId:
          type: integer
          description: >
            ID of the project to link this task to. Must belong to the caller's
            org; omit to create an unlinked task.
        title:
          type: string
          minLength: 1
          description: Short, descriptive title for the task (must be non-empty).
        description:
          type: string
          description: Optional detailed description of the work to be done.
        status:
          type: string
          description: >
            Workflow stage ID (as a string) for the initial task status.
            Must be a valid, non-archived stage belonging to the caller's org.
        priority:
          type: string
          enum: [low, medium, high, critical]
          description: Urgency level of the task.
        category:
          type: string
          enum: [incident, change, maintenance, deployment, support, other]
          description: IT operational category for the task.
        assignee:
          type: string
          description: >
            Email address of the org member to assign. Must match an existing
            org member; omit to leave unassigned.
        dueDate:
          type: string
          description: Task deadline in `YYYY-MM-DD` format.
        customFields:
          type: object
          additionalProperties: true
          description: >
            Custom field values to set on creation. Keyed by field definition ID.
            Values must match the field type. Omit to use empty defaults.

    TaskUpdate:
      description: Partial update for an existing task. All fields are optional.
      type: object
      properties:
        projectId:
          type: ["integer", "null"]
          description: >
            Updated project link. Pass `null` to unlink from the current
            project. Must belong to the caller's org if non-null.
        title:
          type: string
          minLength: 1
          description: New task title.
        description:
          type: string
          description: Updated description.
        status:
          type: string
          description: >
            New workflow stage ID (as a string). Must be a valid stage
            belonging to the caller's org.
        priority:
          type: string
          enum: [low, medium, high, critical]
          description: New priority level.
        category:
          type: string
          enum: [incident, change, maintenance, deployment, support, other]
          description: New IT operational category.
        assignee:
          type: string
          nullable: true
          description: >
            Updated assignee email. Must match an org member. Pass `null` to
            unassign; omit to leave unchanged.
        dueDate:
          type: string
          nullable: true
          description: Updated deadline in `YYYY-MM-DD` format. Pass `null` to clear.
        customFields:
          type: object
          additionalProperties: true
          description: >
            Merged update to custom field values. Only keys present in this object
            are written; omit the key to leave a field unchanged.

    BulkTaskPatchInput:
      description: Payload for bulk-updating multiple tasks.
      type: object
      required: [ids, patch]
      properties:
        ids:
          type: array
          items:
            type: integer
          minItems: 1
          description: IDs of tasks to update. Tasks not belonging to the org are skipped.
        patch:
          type: object
          description: Fields to apply to each task. Identical semantics to TaskUpdate.
          properties:
            status:
              type: string
              description: >
                Workflow stage ID (as a string). Must be a valid stage belonging
                to the caller's org.
            priority:
              type: string
              enum: [low, medium, high, critical]
            category:
              type: string
              enum: [incident, change, maintenance, deployment, support, other]
            assignee:
              type: string
              nullable: true
              description: Email of an org member, or null to unassign.

    BulkTaskPatchResult:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer
          description: Number of tasks successfully updated.

    BulkTaskDeleteInput:
      description: Payload for bulk-deleting multiple tasks.
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: integer
          minItems: 1
          description: IDs of tasks to delete. Tasks not belonging to the org are skipped.

    BulkTaskDeleteResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer
          description: Number of tasks successfully deleted.

    CustomFieldDefinition:
      description: A typed metadata field definition scoped to an org.
      type: object
      required: [id, orgId, name, type, position, createdAt, updatedAt]
      properties:
        id:
          type: integer
          description: Auto-incremented primary key.
        orgId:
          type: string
          description: ID of the org this field belongs to.
        name:
          type: string
          description: Display name of the field shown in the task form.
        type:
          type: string
          enum: [text, number, date, single_select, multi_select]
          description: >
            Data type of the field. `text` — single-line string; `number` — numeric value;
            `date` — ISO date string; `single_select` — one value from `options`;
            `multi_select` — multiple values from `options`.
        options:
          type: array
          items:
            type: string
          nullable: true
          description: >
            Predefined option labels for `single_select` and `multi_select`
            fields. Null for other types.
        position:
          type: integer
          description: Display order. Lower values appear first.
        deletedAt:
          type: ["string", "null"]
          description: >
            ISO 8601 timestamp of soft-deletion. Null if the field is active.
        createdAt:
          type: string
          description: ISO 8601 timestamp when the definition was created.
        updatedAt:
          type: string
          description: ISO 8601 timestamp when the definition was last updated.

    CustomFieldDefinitionInput:
      description: Fields required to create a custom field definition.
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          description: Display name for the new field.
        type:
          type: string
          enum: [text, number, date, single_select, multi_select]
          description: Data type of the field. Cannot be changed after creation.
        options:
          type: array
          items:
            type: string
          description: >
            Required for `single_select` and `multi_select` types. Ignored for
            other types.

    CustomFieldDefinitionUpdate:
      description: Partial update for a custom field definition.
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: New display name for the field.
        options:
          type: array
          items:
            type: string
          description: Replacement options list for select fields.
        force:
          type: boolean
          description: >
            When true, the options update proceeds even if some removed options
            are still stored in existing task records. Stale values are cleared
            from those tasks automatically. Omit or pass false to receive a 409
            conflict response instead.

    CustomFieldPurgeResult:
      description: >
        Returned after a successful purge of a custom field definition and all
        its stored data.
      type: object
      required: [deletedFieldId, affectedTaskCount]
      properties:
        deletedFieldId:
          type: integer
          description: ID of the field definition that was permanently deleted.
        affectedTaskCount:
          type: integer
          description: Number of tasks from which the field's stored value was erased.

    CustomFieldOptionConflict:
      description: >
        Returned when a PATCH to a select field's options would orphan values
        already stored in task records.
      type: object
      required: [error, affectedTaskCount]
      properties:
        error:
          type: string
          description: Human-readable explanation of the conflict.
        affectedTaskCount:
          type: integer
          description: Number of tasks that store one or more of the removed option values.

    CustomFieldReorderInput:
      description: Ordered list of field definition IDs for reordering.
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: integer
          description: >
            Field definition IDs in the desired display order. Each ID must
            belong to the caller's org.

    TaskEvent:
      description: >
        An immutable record of a single field-level change to a task.
        One event is emitted per changed field on every PATCH, plus a synthetic
        "created" event when the task is first inserted.
      type: object
      required: [id, taskId, orgId, field, createdAt]
      properties:
        id:
          type: integer
          description: Auto-incremented primary key.
        taskId:
          type: integer
          description: ID of the task this event belongs to.
        orgId:
          type: string
          description: Org the task belongs to.
        actorId:
          type: ["string", "null"]
          description: User ID of the actor who triggered the change. Null for system events.
        actorName:
          type: ["string", "null"]
          description: Display name of the actor at the time of the change.
        field:
          type: string
          description: >
            Which field changed. "created" for task creation; otherwise one of
            "status", "priority", "assignee", "category", "title", "dueDate",
            "projectId".
        oldValue:
          type: ["string", "null"]
          description: Serialized previous value. Null when the field had no prior value.
        newValue:
          type: ["string", "null"]
          description: Serialized new value. Null when the field was cleared.
        createdAt:
          type: string
          description: ISO 8601 timestamp when the event was recorded.

    CommentReactionSummary:
      description: Aggregated emoji reaction counts for a single emoji on a comment.
      type: object
      required: [emoji, count, userIds]
      properties:
        emoji:
          type: string
          description: The unicode emoji character.
        count:
          type: integer
          description: Total number of reactions with this emoji.
        userIds:
          type: array
          description: IDs of the users who reacted with this emoji.
          items:
            type: string

    Comment:
      description: A comment attached to a task.
      type: object
      required: [id, taskId, content, createdAt, reactions]
      properties:
        id:
          type: integer
          description: Auto-incremented primary key.
        taskId:
          type: integer
          description: ID of the task this comment belongs to.
        content:
          type: string
          description: Plain-text body of the comment.
        author:
          type: ["string", "null"]
          description: >
            Display name or identifier of the comment author. Not validated
            against org members. Null if no author was provided at creation
            time.
        createdAt:
          type: string
          description: ISO 8601 timestamp when the comment was posted.
        reactions:
          type: array
          description: Emoji reaction summaries for this comment.
          items:
            $ref: '#/components/schemas/CommentReactionSummary'
          default: []

    CommentInput:
      description: Fields required to add a comment to a task.
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          description: Plain-text body of the comment (must be non-empty).
        author:
          type: string
          description: >
            Optional display name for the author. Not validated against org
            membership; purely informational.

    NoteVisibility:
      type: string
      enum: [private, public_read, public_write]
      description: >
        Controls who can see and edit a note within the organization.
        `private` - only the owner can read or write; `public_read` - all org
        members can read but only the owner can write; `public_write` - all org
        members can read and write (but only the owner can delete or change
        visibility).

    Note:
      description: >
        A rich-text scratch-pad note scoped to an organization and optionally
        linked to a project or task.
      type: object
      required: [id, title, content, visibility, isOwner, createdAt, updatedAt]
      properties:
        id:
          type: integer
          description: Auto-incremented primary key.
        title:
          type: string
          description: Short descriptive title for the note.
        content:
          type: string
          description: Rich-text body of the note (typically stored as HTML or Markdown).
        visibility:
          $ref: "#/components/schemas/NoteVisibility"
        isOwner:
          type: boolean
          description: >
            True when the caller is the note owner (or the note has no owner,
            i.e. a legacy note). Controls whether the caller can change
            visibility or delete the note.
        createdBy:
          type: ["string", "null"]
          description: >
            User ID of the note creator. Null for legacy notes created before
            ownership tracking was introduced.
        projectId:
          type: ["integer", "null"]
          description: ID of the linked project. Null if not associated with a project.
        taskId:
          type: ["integer", "null"]
          description: ID of the linked task. Null if not associated with a task.
        createdAt:
          type: string
          description: ISO 8601 timestamp when the note was created.
        updatedAt:
          type: string
          description: ISO 8601 timestamp when the note was last updated.

    NoteInput:
      description: Fields for creating a new note. All fields are optional except that a useful note should have at least a title or content.
      type: object
      properties:
        title:
          type: string
          minLength: 1
          description: Short descriptive title for the note.
        content:
          type: string
          description: Rich-text body of the note.
        visibility:
          $ref: "#/components/schemas/NoteVisibility"
        projectId:
          type: integer
          description: >
            Link this note to a project. Must belong to the caller's org.
        taskId:
          type: integer
          description: >
            Link this note to a task. Must belong to the caller's org.

    NoteUpdate:
      description: Partial update for an existing note. All fields are optional.
      type: object
      properties:
        title:
          type: string
          minLength: 1
          description: New title for the note.
        content:
          type: string
          description: Updated rich-text body.
        visibility:
          $ref: "#/components/schemas/NoteVisibility"
        projectId:
          type: ["integer", "null"]
          description: >
            Updated project link. Pass `null` to remove the association. Must
            belong to the caller's org if non-null. Only the note owner can
            change this.
        taskId:
          type: ["integer", "null"]
          description: >
            Updated task link. Pass `null` to remove the association. Must
            belong to the caller's org if non-null. Only the note owner can
            change this.

    DashboardSummary:
      description: Aggregated statistics for the caller's organization, computed in real time.
      type: object
      required: [totalTasks, totalProjects, tasksByStageType, tasksByPriority, overdueCount, activeProjects]
      properties:
        totalTasks:
          type: integer
          description: Total number of tasks in the organization regardless of status.
        totalProjects:
          type: integer
          description: Total number of projects in the organization regardless of status.
        tasksByStageType:
          type: object
          description: Task counts grouped by stage type (open vs closed).
          required: [open, closed]
          properties:
            open:
              type: integer
              description: Number of tasks in an 'open' stage (unresolved).
            closed:
              type: integer
              description: Number of tasks in a 'closed' stage (resolved).
        stageBreakdown:
          type: array
          description: Per-stage task counts, ordered by stage position.
          items:
            type: object
            required: [stageId, stageName, stageColor, stageType, count]
            properties:
              stageId:
                type: integer
              stageName:
                type: string
              stageColor:
                type: string
              stageType:
                type: string
                enum: [open, closed]
              count:
                type: integer
        tasksByPriority:
          type: object
          description: Task counts grouped by priority level.
          properties:
            low:
              type: integer
              description: Number of tasks with priority `low`.
            medium:
              type: integer
              description: Number of tasks with priority `medium`.
            high:
              type: integer
              description: Number of tasks with priority `high`.
            critical:
              type: integer
              description: Number of tasks with priority `critical`.
          required: [low, medium, high, critical]
        overdueCount:
          type: integer
          description: >
            Number of tasks whose `dueDate` is before today and whose stage type
            is 'open' (not yet resolved).
        activeProjects:
          type: integer
          description: Number of projects with status `active`.

    SlaSummary:
      description: >
        SLA compliance metrics for the caller's organization over the requested
        period. Counts tasks with an SLA policy applied that either resolved
        cleanly (no breach) or exceeded their deadline.
      type: object
      required: [complianceRate, totalTracked, withinSlaCount, breachedCount, byPriority]
      properties:
        complianceRate:
          type: number
          description: >
            Percentage of tracked tasks resolved within their SLA target
            (0–100). Returns 100 when no tasks were tracked.
        totalTracked:
          type: integer
          description: >
            Total tasks with an SLA policy that were either resolved cleanly or
            breached within the requested period.
        withinSlaCount:
          type: integer
          description: Tasks closed without breaching their SLA deadline.
        breachedCount:
          type: integer
          description: Tasks that exceeded their SLA deadline (`slaBreachedAt` is set).
        avgBreachMinutes:
          type: number
          nullable: true
          description: >
            Average number of minutes past the SLA deadline across all
            breached tasks. Null when there are no breaches.
        byPriority:
          type: array
          description: Per-priority breakdown of compliance metrics.
          items:
            type: object
            required: [priority, totalTracked, breachedCount, complianceRate]
            properties:
              priority:
                type: string
                enum: [low, medium, high, critical]
              totalTracked:
                type: integer
              breachedCount:
                type: integer
              complianceRate:
                type: number

    ActivityItem:
      description: >
        A single event in the organization's recent activity feed. Events are
        sourced from recently created tasks, comments, and projects.
      type: object
      required: [id, type, title, entityId, entityType, createdAt]
      properties:
        id:
          type: integer
          description: >
            Synthetic unique ID for the activity item. Task IDs are used
            directly; comment IDs are offset by 100,000 and project IDs by
            200,000 to avoid collisions in the merged list.
        type:
          type: string
          description: >
            Event type. One of `task_created`, `comment_added`, or
            `project_created`.
        title:
          type: string
          description: Human-readable description of the activity event.
        entityId:
          type: integer
          description: Numeric ID of the primary entity associated with this event.
        entityType:
          type: string
          description: >
            Type of the primary entity. One of `task` or `project`.
        createdAt:
          type: string
          description: ISO 8601 timestamp of when the event occurred.

    InvitationPreview:
      description: >
        Public preview of an invitation, returned without authentication so the
        invite landing page can display the organization name before the user
        logs in.
      type: object
      required: [orgName, expiresAt]
      properties:
        orgName:
          type: string
          description: Display name of the organization the user is being invited to join.
        expiresAt:
          type: string
          description: ISO 8601 timestamp when the invitation expires.

    RenameOrgInput:
      description: Request body for renaming an organization.
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: New display name for the organization (1–200 characters).

    Organization:
      description: An organization record.
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          description: UUID of the organization.
        name:
          type: string
          description: Display name of the organization.
        createdAt:
          type: string
          description: ISO 8601 timestamp when the organization was created.

    PendingInvitation:
      description: Summary of a pending invitation shown to a user who has not yet joined an org.
      type: object
      required: [id, orgId, orgName, token, expiresAt]
      properties:
        id:
          type: string
          description: UUID of the invitation.
        orgId:
          type: string
          description: UUID of the organization that sent the invitation.
        orgName:
          type: string
          description: Display name of the inviting organization.
        token:
          type: string
          description: Opaque token used to accept or decline the invitation.
        expiresAt:
          type: string
          description: ISO 8601 timestamp when this invitation expires.

    OrgFeatureState:
      type: string
      enum: [enabled, disabled, unsubscribed]
      description: >
        Activation state of an org feature flag.
        'enabled' = available (default); 'disabled' = turned off by instance admin;
        'unsubscribed' = not included in org's plan (shows Upgrade prompt).

    OrgMeResponse:
      description: >
        Current organization context for the authenticated user. Either `org`
        or `pendingInvitation` will be non-null; both are null when the user
        has no org relationship.
      type: object
      required: [org, pendingInvitation]
      properties:
        org:
          oneOf:
            - $ref: '#/components/schemas/Organization'
            - type: 'null'
          description: The organization the user belongs to. Null if they are not a member.
        roleId:
          type: ["string", "null"]
          description: ID of the caller's current role. Null when `org` is null.
        roleName:
          type: ["string", "null"]
          description: Display name of the caller's current role. Null when `org` is null.
        permissions:
          oneOf:
            - $ref: '#/components/schemas/RolePermissions'
            - type: 'null'
          description: Full set of permission flags for the caller's role. Null when `org` is null.
        features:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/OrgFeatureState'
          description: >
            Map of each org feature key to its current state. Keys absent from
            the map default to 'enabled'. Only present when the user is a member
            of an org.
        pendingInvitation:
          oneOf:
            - $ref: '#/components/schemas/PendingInvitation'
            - type: 'null'
          description: >
            The oldest non-expired pending invitation for this user. Present
            only when the user is not yet a member of any org. Null otherwise.
        terminology:
          oneOf:
            - $ref: '#/components/schemas/OrgTerminologyMap'
            - type: 'null'
          description: >
            Resolved terminology labels for this org. All five keys are always
            present. Only set when the user is a member of an org.

    OrgTerminologyMap:
      description: >
        Resolved terminology map for an org — all five keys are always present,
        defaulting to English when no custom label has been set.
      type: object
      required: [projects, tasks, members, workflows, stages]
      properties:
        projects:
          type: string
          description: Label for "Projects" (e.g. "Services", "Initiatives").
        tasks:
          type: string
          description: Label for "Tasks" (e.g. "Tickets", "Issues", "Requests").
        members:
          type: string
          description: Label for "Members" (e.g. "Agents", "Users", "Staff").
        workflows:
          type: string
          description: Label for "Workflows" (e.g. "Pipelines", "Processes").
        stages:
          type: string
          description: Label for "Stages" (e.g. "Steps", "Statuses", "Phases").

    PatchOrgTerminologyBody:
      description: >
        Partial map of terminology overrides. Only supplied keys are updated.
        Each label must be a non-empty string of at most 50 characters.
      type: object
      properties:
        projects:
          type: string
          minLength: 1
          maxLength: 50
        tasks:
          type: string
          minLength: 1
          maxLength: 50
        members:
          type: string
          minLength: 1
          maxLength: 50
        workflows:
          type: string
          minLength: 1
          maxLength: 50
        stages:
          type: string
          minLength: 1
          maxLength: 50

    OrgMemberInfo:
      description: Profile and membership information for a single org member.
      type: object
      required: [userId, roleId, roleName, permissions, joinedAt]
      properties:
        userId:
          type: string
          description: Unique user ID of the member.
        roleId:
          type: string
          description: ID of the member's current role.
        roleName:
          type: string
          description: Display name of the member's current role.
        permissions:
          $ref: '#/components/schemas/RolePermissions'
        joinedAt:
          type: string
          description: ISO 8601 timestamp when the user joined the organization.
        firstName:
          type: ["string", "null"]
          description: Member's given name. Null if not set in their profile.
        lastName:
          type: ["string", "null"]
          description: Member's family name. Null if not set in their profile.
        email:
          type: ["string", "null"]
          description: Member's email address. Null if not set in their profile.
        profileImageUrl:
          type: ["string", "null"]
          description: URL of the member's profile picture. Null if not set.

    InvitationInfo:
      description: Full invitation record visible to admins.
      type: object
      required: [id, orgId, token, status, expiresAt, createdAt]
      properties:
        id:
          type: string
          description: UUID of the invitation.
        orgId:
          type: string
          description: UUID of the organization that issued the invitation.
        invitedEmail:
          type: ["string", "null"]
          description: Email address the invitation was sent to. Null if the invitation was created by userId only.
        invitedUserId:
          type: ["string", "null"]
          description: User ID the invitation is addressed to. Null if the invitation was created by email only.
        token:
          type: string
          description: Opaque token used to accept or decline the invitation.
        status:
          type: string
          enum: [pending, accepted, declined]
          description: >
            Current state of the invitation. `pending` - awaiting a response;
            `accepted` - the invitee joined the org; `declined` - the invitee
            rejected it.
        expiresAt:
          type: string
          description: ISO 8601 timestamp when the invitation expires (7 days after creation).
        createdAt:
          type: string
          description: ISO 8601 timestamp when the invitation was issued.

    OrgInput:
      description: Request body for creating a new organization.
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Display name for the new organization (1–200 characters).

    InviteMemberInput:
      description: >
        Target user to invite. At least one of `email` or `userId` must be
        provided; both may be supplied together.
      type: object
      properties:
        email:
          type: string
          description: Email address of the user to invite.
        userId:
          type: string
          description: User ID of the user to invite.

    UpdateMemberRoleInput:
      description: Request body for assigning a role to an org member.
      type: object
      required: [roleId]
      properties:
        roleId:
          type: string
          description: >
            ID of the role to assign. Must belong to the same organization.
            Only owners can assign the Owner built-in role.

    RolePermissions:
      description: >
        Boolean permission flags for a role. Every key is present; `true` grants
        the permission, `false` denies it.
      type: object
      required:
        - view_tasks
        - create_tasks
        - edit_tasks
        - close_tasks
        - delete_tasks
        - delete_comments
        - manage_projects
        - manage_org_settings
        - manage_members
        - manage_webhooks
        - manage_api_keys
        - manage_custom_fields
        - manage_workflow_stages
        - manage_sla_policies
        - manage_task_templates
        - manage_saved_views
        - view_audit_log
        - manage_terminology
        - manage_reactions
      properties:
        view_tasks:
          type: boolean
        create_tasks:
          type: boolean
        edit_tasks:
          type: boolean
        close_tasks:
          type: boolean
        delete_tasks:
          type: boolean
        delete_comments:
          type: boolean
          description: >
            When true, the member can delete comments posted by other members.
            Members can always delete their own comments regardless of this flag.
        manage_projects:
          type: boolean
        manage_org_settings:
          type: boolean
        manage_members:
          type: boolean
        manage_webhooks:
          type: boolean
        manage_api_keys:
          type: boolean
        manage_custom_fields:
          type: boolean
        manage_workflow_stages:
          type: boolean
        manage_sla_policies:
          type: boolean
        manage_task_templates:
          type: boolean
        manage_saved_views:
          type: boolean
        view_audit_log:
          type: boolean
        manage_terminology:
          type: boolean
          description: >
            When true, the member can rename user-facing labels (Projects, Tasks,
            Members, Workflows, Stages) via the Terminology settings.
        manage_reactions:
          type: boolean
          description: >
            When true, the member can manage the org's emoji reaction palette.

    Role:
      description: A named role within an organization with a set of permission flags.
      type: object
      required: [id, orgId, name, isBuiltIn, isOwner, permissions, createdAt]
      properties:
        id:
          type: string
          description: UUID of the role.
        orgId:
          type: string
          description: UUID of the owning organization.
        name:
          type: string
          description: Display name of the role (e.g. "Owner", "Admin", "Member", or a custom name).
        isBuiltIn:
          type: boolean
          description: >
            `true` for the three system-seeded roles (Owner, Admin, Member).
            Built-in roles cannot be deleted.
        isOwner:
          type: boolean
          description: >
            `true` only for the Owner built-in role whose permissions are
            immutable and cannot be changed.
        permissions:
          $ref: '#/components/schemas/RolePermissions'
        createdAt:
          type: string
          description: ISO 8601 timestamp when the role was created.

    CreateRoleInput:
      description: Request body for creating a new custom role.
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Display name for the new role. Must be unique within the org.
        permissions:
          $ref: '#/components/schemas/RolePermissions'

    UpdateRoleInput:
      description: >
        Request body for updating a role's name and/or permissions. Only
        provided fields are changed. The Owner built-in role cannot be modified.
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: New display name. Must be unique within the org.
        permissions:
          $ref: '#/components/schemas/RolePermissions'

    SimpleSuccess:
      description: Generic success acknowledgement with no additional data.
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          description: Always `true` when the operation completed successfully.

    WebhookVisibility:
      type: string
      enum: [private, public_read, public_write]
      description: >
        `private` - only the creator can read or write; `public_read` - all org
        members can read but only the creator can edit; `public_write` - all org
        members can read and use the webhook.

    WebhookTaskTemplate:
      description: >
        Controls how an inbound payload is mapped to task fields.
        All fields are optional; absent fields fall back to sensible defaults.
      type: object
      properties:
        titleField:
          type: string
          description: Dot-notation JSON path in the payload used as the task title (e.g. "alertname").
        defaultTitle:
          type: string
          description: Static title fallback when the payload has no title field.
        descriptionField:
          type: string
          description: Dot-notation path used as the task description.
        defaultPriority:
          type: string
          enum: [low, medium, high, critical]
          description: Priority applied when the payload doesn't specify one.
        defaultCategory:
          type: string
          enum: [incident, change, maintenance, deployment, support, other]
          description: Category applied when the payload doesn't specify one.
        fieldMapping:
          type: object
          additionalProperties:
            type: string
          description: >
            Free-form mapping of dot-notation payload paths to task field names.
            Example - { "labels.severity": "priority" }.

    InboundWebhook:
      description: An inbound webhook that accepts external payloads and creates tasks.
      type: object
      required: [id, orgId, createdBy, name, token, taskTemplate, visibility, enabled, rateLimitPerMinute, isOwner, ingestUrl, createdAt, updatedAt]
      properties:
        id:
          type: integer
        orgId:
          type: string
        projectId:
          type: ["integer", "null"]
          description: Optional project the created tasks are filed under.
        createdBy:
          type: string
        name:
          type: string
        token:
          type: string
          description: 64-character hex token embedded in the ingest URL.
        taskTemplate:
          $ref: '#/components/schemas/WebhookTaskTemplate'
        taskTemplateId:
          type: ["integer", "null"]
          description: ID of the task template used to seed the TemplateBuilder defaults. Null when no template was selected.
        taskTemplateName:
          type: ["string", "null"]
          description: Display name of the linked task template, for reference in the webhook list. Null when no template is linked or the template was deleted.
        visibility:
          $ref: '#/components/schemas/WebhookVisibility'
        enabled:
          type: boolean
        rateLimitPerMinute:
          type: integer
          minimum: 1
          description: Maximum tasks this webhook may create in any rolling 60-second window. Exceeding this returns 429.
        isOwner:
          type: boolean
          description: True when the authenticated user is the creator.
        ingestUrl:
          type: string
          description: Relative path for the public ingest endpoint. Prepend the API origin to get the full URL.
        createdAt:
          type: string
        updatedAt:
          type: string

    InboundWebhookInput:
      description: Fields for creating an inbound webhook.
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        projectId:
          type: integer
          description: Optional project to pin ingest-created tasks to.
        visibility:
          $ref: '#/components/schemas/WebhookVisibility'
        enabled:
          type: boolean
          default: true
        taskTemplate:
          $ref: '#/components/schemas/WebhookTaskTemplate'
        taskTemplateId:
          type: ["integer", "null"]
          description: ID of the task template used to seed the TemplateBuilder defaults.
        rateLimitPerMinute:
          type: integer
          minimum: 1
          maximum: 10000
          default: 60
          description: Maximum tasks per 60-second rolling window. Default is 60.

    InboundWebhookUpdate:
      description: Partial update for an inbound webhook.
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        projectId:
          type: ["integer", "null"]
        visibility:
          $ref: '#/components/schemas/WebhookVisibility'
        enabled:
          type: boolean
        taskTemplate:
          $ref: '#/components/schemas/WebhookTaskTemplate'
        taskTemplateId:
          type: ["integer", "null"]
          description: ID of the task template used to seed the TemplateBuilder defaults.
        rateLimitPerMinute:
          type: integer
          minimum: 1
          maximum: 10000

    OutboundWebhook:
      description: An outbound webhook that POSTs signed event payloads to an external URL.
      type: object
      required: [id, orgId, createdBy, name, url, secret, events, visibility, enabled, isOwner, createdAt, updatedAt]
      properties:
        id:
          type: integer
        orgId:
          type: string
        projectId:
          type: ["integer", "null"]
          description: Optional project filter. When set, only fires for events on this project.
        createdBy:
          type: string
        name:
          type: string
        url:
          type: string
          description: Target URL Opsly will POST event payloads to.
        secret:
          type: string
          description: 64-character hex secret used to sign outbound payloads (X-Opsly-Signature).
        events:
          type: array
          items:
            type: string
            enum: [task.created, task.updated, task.status_changed, task.assigned, task.commented, task.sla_breached, task.sla_warning, task.deleted, task.watcher_added, task.watcher_removed, project.created, project.updated, project.deleted, member.joined, member.removed, note.created, note.updated, note.deleted]
          description: Event types this webhook subscribes to.
        visibility:
          $ref: '#/components/schemas/WebhookVisibility'
        enabled:
          type: boolean
        isOwner:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    OutboundWebhookDelivery:
      description: A single delivery attempt made by an outbound webhook.
      type: object
      required: [id, webhookId, event, url, success, durationMs, createdAt]
      properties:
        id:
          type: integer
        webhookId:
          type: integer
        event:
          type: string
        url:
          type: string
        statusCode:
          type: ["integer", "null"]
          description: HTTP status code from the external server, null on network error.
        success:
          type: boolean
          description: True when the external server returned a 2xx status.
        durationMs:
          type: integer
          description: Round-trip time in milliseconds.
        error:
          type: ["string", "null"]
          description: Network-level error message when the request could not be sent.
        createdAt:
          type: string

    OutboundWebhookInput:
      description: Fields for creating an outbound webhook.
      type: object
      required: [name, url, events]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        url:
          type: string
          description: Target URL for event delivery.
        projectId:
          type: integer
          description: Optional project filter.
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum: [task.created, task.updated, task.status_changed, task.assigned, task.commented, task.sla_breached, task.sla_warning, task.deleted, task.watcher_added, task.watcher_removed, project.created, project.updated, project.deleted, member.joined, member.removed, note.created, note.updated, note.deleted]
        visibility:
          $ref: '#/components/schemas/WebhookVisibility'
        enabled:
          type: boolean
          default: true

    OutboundWebhookUpdate:
      description: Partial update for an outbound webhook.
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        url:
          type: string
        projectId:
          type: ["integer", "null"]
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum: [task.created, task.updated, task.status_changed, task.assigned, task.commented, task.sla_breached, task.sla_warning, task.deleted, task.watcher_added, task.watcher_removed, project.created, project.updated, project.deleted, member.joined, member.removed, note.created, note.updated, note.deleted]
        visibility:
          $ref: '#/components/schemas/WebhookVisibility'
        enabled:
          type: boolean

    WebhookIngestPayload:
      description: >
        JSON payload POSTed to the ingest endpoint by an external system.
        Only `title` is required; all other fields are optional and supplement or
        override the webhook's task template.
      type: object
      properties:
        title:
          type: string
          description: Task title. Required unless the webhook template specifies a titleField.
        description:
          type: string
        priority:
          type: string
          enum: [low, medium, high, critical]
        category:
          type: string
          enum: [incident, change, maintenance, deployment, support, other]
        dueDate:
          type: string
          description: Task deadline in YYYY-MM-DD format.
      additionalProperties: true

    ApiKeyScope:
      type: string
      enum:
        - tasks:read
        - tasks:write
        - projects:read
        - projects:write
        - comments:read
        - comments:write
        - webhooks:read
        - webhooks:write
      description: Scope granted to an API key.

    ApiKey:
      description: API key metadata (the raw key value is never returned after creation).
      type: object
      required: [id, name, keyPrefix, scopes, isExpired, createdAt, revokedAt, expiresAt, createdBy]
      properties:
        id:
          type: string
        name:
          type: string
          description: Human-readable label for this key.
        keyPrefix:
          type: string
          description: First 8 characters of the key, for identification.
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
          description: Scopes granted to this key.
        isExpired:
          type: boolean
          description: True if the key has passed its expiry date.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 expiry timestamp, or null if the key never expires.
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 revocation timestamp, or null if the key is still active.
        createdBy:
          type: object
          nullable: true
          properties:
            firstName:
              type: string
              nullable: true
            lastName:
              type: string
              nullable: true
            email:
              type: string
              nullable: true

    ApiKeyInput:
      description: Fields for creating a new API key.
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Human-readable label (e.g. "Prometheus exporter").
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
          minItems: 1
          description: Scopes this key is allowed to use.
        expiresAt:
          type: string
          format: date-time
          description: Optional expiry date-time. Omit for a non-expiring key.

    ApiKeyCreated:
      description: API key metadata plus the full key value (shown exactly once at creation).
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The full API key value. Store it securely — it cannot be retrieved again.

    TaskTemplate:
      description: A reusable task template that pre-fills the task creation form.
      type: object
      required: [id, orgId, createdBy, name, defaultTitle, defaultPriority, defaultCategory, createdAt, updatedAt]
      properties:
        id:
          type: integer
        orgId:
          type: string
        createdBy:
          type: string
        name:
          type: string
          description: Display name for the template (e.g. "Database Outage Response").
        defaultTitle:
          type: string
          description: Default task title pre-filled from this template.
        defaultPriority:
          type: string
          enum: [low, medium, high, critical]
        defaultCategory:
          type: string
          enum: [incident, change, maintenance, deployment, support, other]
        defaultDescription:
          type: ["string", "null"]
          description: Default task description / runbook steps. Null when not set.
        createdAt:
          type: string
        updatedAt:
          type: string

    TaskTemplateInput:
      description: Fields for creating a new task template.
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        defaultTitle:
          type: string
          maxLength: 500
        defaultPriority:
          type: string
          enum: [low, medium, high, critical]
        defaultCategory:
          type: string
          enum: [incident, change, maintenance, deployment, support, other]
        defaultDescription:
          type: string

    TaskTemplateUpdate:
      description: Partial update for a task template.
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        defaultTitle:
          type: string
          maxLength: 500
        defaultPriority:
          type: string
          enum: [low, medium, high, critical]
        defaultCategory:
          type: string
          enum: [incident, change, maintenance, deployment, support, other]
        defaultDescription:
          type: ["string", "null"]

    TaskTemplateParams:
      description: Path parameter for task template routes.
      type: object
      required: [id]
      properties:
        id:
          type: integer

    SlaPolicy:
      description: SLA response and resolution targets for a single priority level.
      type: object
      required: [id, orgId, priority]
      properties:
        id:
          type: integer
        orgId:
          type: string
        priority:
          type: string
          enum: [low, medium, high, critical]
        responseMinutes:
          type: ["integer", "null"]
          description: Maximum minutes before a first response is required. Null means no target.
        resolutionMinutes:
          type: ["integer", "null"]
          description: Maximum minutes before the task must be resolved. Null means no target.
        warningThresholdPercent:
          type: integer
          description: Percentage of the resolution window elapsed before a warning webhook fires. Default 80.
        createdAt:
          type: string
        updatedAt:
          type: string

    SLAPolicyEntry:
      description: One priority's SLA targets in the PUT request body.
      type: object
      required: [priority]
      properties:
        priority:
          type: string
          enum: [low, medium, high, critical]
        responseMinutes:
          type: ["integer", "null"]
          minimum: 1
        resolutionMinutes:
          type: ["integer", "null"]
          minimum: 1
        warningThresholdPercent:
          type: integer
          minimum: 1
          maximum: 99
          description: Percentage of resolution window at which the warning webhook fires (default 80).

    SLAPoliciesInput:
      description: Full set of SLA policies for the org (up to four entries, one per priority).
      type: object
      required: [policies]
      properties:
        policies:
          type: array
          items:
            $ref: "#/components/schemas/SLAPolicyEntry"
          maxItems: 4

    SavedViewFilters:
      description: Filter state stored in a saved view.
      type: object
      properties:
        status:
          type: string
          description: Task status filter value.
        priority:
          type: string
          description: Task priority filter value.
        category:
          type: string
          description: Task category filter value.
        assignee:
          type: string
          description: Assignee email filter value.
        dateFrom:
          type: string
          description: Due date lower bound in YYYY-MM-DD format.
        dateTo:
          type: string
          description: Due date upper bound in YYYY-MM-DD format.
        projectFilter:
          type: string
          enum: [all, with_project, no_project]
          description: Project presence filter.
        search:
          type: string
          description: Free-text search string.
        customFieldId:
          type: integer
          description: Custom field definition ID to filter by.
        customFieldValue:
          type: string
          description: Exact option value to match for the custom field identified by customFieldId.
        watching:
          type: boolean
          description: When true, limits results to tasks the user is watching.
        slaBreached:
          type: boolean
          description: When true, limits results to tasks that have breached their SLA deadline.
        overdue:
          type: boolean
          description: When true, limits results to tasks that are past their due date.
        stageType:
          type: string
          description: Filter by workflow stage type (e.g. "open" or "closed").

    SavedView:
      description: A named, persisted set of task filters.
      type: object
      required: [id, orgId, createdBy, name, filters, isOrgWide, isDefault, createdAt, updatedAt]
      properties:
        id:
          type: integer
          description: Auto-incremented primary key.
        orgId:
          type: string
          description: Organization this view belongs to.
        createdBy:
          type: string
          description: User ID of the view creator.
        name:
          type: string
          description: Human-readable name for the view.
        filters:
          $ref: "#/components/schemas/SavedViewFilters"
        isOrgWide:
          type: boolean
          description: When true the view is visible to all org members.
        isDefault:
          type: boolean
          description: When true this view loads automatically on /tasks for its owner.
        createdAt:
          type: string
          description: ISO 8601 creation timestamp.
        updatedAt:
          type: string
          description: ISO 8601 last-updated timestamp.

    SavedViewInput:
      description: Request body for creating a saved view.
      type: object
      required: [name, filters]
      properties:
        name:
          type: string
          minLength: 1
          description: Display name for the view.
        filters:
          $ref: "#/components/schemas/SavedViewFilters"
        isOrgWide:
          type: boolean
          description: Whether the view is visible to all org members. Defaults to false.
        isDefault:
          type: boolean
          description: Whether this view should load automatically for the creator. Defaults to false.

    SavedViewUpdate:
      description: Partial update for a saved view.
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: New display name.
        filters:
          $ref: "#/components/schemas/SavedViewFilters"
        isOrgWide:
          type: boolean
          description: Change org-wide visibility.
        isDefault:
          type: boolean
          description: Pin or unpin as the user's default view.

    WorkflowStage:
      description: An org-defined workflow stage. Replaces the hardcoded task status enum.
      type: object
      required: [id, orgId, name, color, type, position, createdAt, updatedAt]
      properties:
        id:
          type: integer
          description: Auto-incremented primary key.
        orgId:
          type: string
          description: ID of the owning organization.
        name:
          type: string
          description: Display name of the stage (e.g. "In Review").
        color:
          type: string
          description: Hex color for display (e.g. "#f59e0b").
        type:
          type: string
          enum: [open, closed]
          description: >
            Stage type. `open` — task is unresolved; `closed` — task is resolved.
            Used for SLA tracking and dashboard counts.
        position:
          type: integer
          description: Sort order within the org (0-based, ascending).
        archivedAt:
          type: ["string", "null"]
          description: ISO 8601 timestamp when the stage was archived. Null if active.
        createdAt:
          type: string
          description: ISO 8601 creation timestamp.
        updatedAt:
          type: string
          description: ISO 8601 last-updated timestamp.

    WorkflowStageInput:
      description: Fields for creating a new workflow stage.
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Display name for the stage.
        color:
          type: string
          description: Hex color code (e.g. "#6b7280"). Defaults to gray if omitted.
        type:
          type: string
          enum: [open, closed]
          description: Stage type. Defaults to `open`.

    WorkflowStageUpdate:
      description: Partial update for a workflow stage.
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: New display name.
        color:
          type: string
          description: New hex color code.
        type:
          type: string
          enum: [open, closed]
          description: >
            Change the stage type. The org must retain at least one active stage
            of the other type.
        archived:
          type: boolean
          description: >
            Pass `true` to archive (hide from new assignments) or `false` to
            restore. The org must retain at least one active stage of each type.

    WorkflowStageReorderInput:
      description: Ordered list of stage IDs for reordering.
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: integer
          description: Stage IDs in the desired display order. Each ID must belong to the caller's org.

    SearchTaskResult:
      description: A task result returned by the global search endpoint.
      type: object
      required: [id, title, status, priority]
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string
        priority:
          type: string
        projectId:
          type: integer
          nullable: true

    SearchProjectResult:
      description: A project result returned by the global search endpoint.
      type: object
      required: [id, name, status]
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string

    SearchNoteResult:
      description: A note result returned by the global search endpoint.
      type: object
      required: [id, title]
      properties:
        id:
          type: integer
        title:
          type: string
        excerpt:
          type: string
          nullable: true
          description: Plain-text excerpt of the note content (up to 120 chars, HTML stripped).

    SearchResults:
      description: Search results grouped by entity type.
      type: object
      required: [tasks, projects, notes]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/SearchTaskResult"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/SearchProjectResult"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/SearchNoteResult"

    WebhookIngestSuccess:
      description: Confirmation returned after a successful ingest.
      type: object
      required: [taskId, orgTaskNumber, title]
      properties:
        taskId:
          type: integer
        orgTaskNumber:
          type: integer
          description: The TSK-## number assigned to the created task.
        title:
          type: string
