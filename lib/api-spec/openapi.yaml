openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Opsly API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: orgs
    description: Organization management
  - name: projects
    description: IT project operations
  - name: tasks
    description: Task operations
  - name: comments
    description: Comment operations
  - name: notes
    description: Rich-text scratch pad notes
  - name: dashboard
    description: Dashboard and analytics
  - name: webhooks
    description: Inbound and outbound webhook management

paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      description: >
        Returns the user object for the active session, or `null` when no valid
        session is present. Accepts either a `Bearer <sid>` Authorization header
        (mobile) or the `sid` session cookie (browser). Never returns a 401 -
        callers must check whether the returned `user` field is null.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      description: >
        Generates a PKCE code challenge, stores transient OIDC state in
        short-lived cookies (`code_verifier`, `nonce`, `state`, `return_to`),
        and issues a 302 redirect to the OIDC provider's authorization endpoint.
        Use `returnTo` to control where the browser lands after a successful
        login; the value must start with `/` and will default to `/` if absent
        or unsafe.
      parameters:
        - name: returnTo
          in: query
          required: false
          description: >
            Relative path to redirect to after a successful login. Must start
            with `/`. Defaults to `/` if omitted or invalid.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      description: >
        Validates the OIDC authorization code response using the PKCE verifier
        and state stored in cookies, exchanges the code for tokens, upserts the
        user record in the database, creates a session, and redirects to the
        `returnTo` path. On any failure (missing cookies, invalid state,
        exchange error) the browser is redirected back to `/api/login`.
      parameters:
        - name: code
          in: query
          required: false
          description: Authorization code returned by the OIDC provider.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: Opaque state value echoed back by the OIDC provider for CSRF protection.
          schema:
            type: string
        - name: iss
          in: query
          required: false
          description: Issuer identifier echoed back by some OIDC providers.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      description: >
        Destroys the server-side session identified by the `Authorization`
        header or `sid` cookie, clears the cookie, and redirects to the OIDC
        provider's end-session endpoint so the provider session is also
        invalidated. The `returnTo` parameter controls where the provider
        redirects the browser after logout.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          description: >
            Relative path to redirect to after logout. Must start with `/`.
            Defaults to `/`.
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      description: >
        Accepts the OIDC authorization code produced by a mobile PKCE flow,
        validates it against the OIDC provider, upserts the user record, and
        returns an opaque session token (`sid`). The caller must include this
        token as `Bearer <token>` in the `Authorization` header on subsequent
        requests. Returns 400 if required fields are missing, 401 if the ID
        token contains no usable claims, and 500 if the provider token exchange
        fails.
      requestBody:
        required: true
        description: OIDC authorization code and associated PKCE parameters from the mobile app.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      description: >
        Deletes the server-side session identified by the `Authorization: Bearer
        <sid>` header. Always returns 200 even when no session is found, so
        callers can safely call this without knowing whether the token is still
        valid.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: >
        Returns the current server health status. Intended for load-balancer and
        uptime probes. Requires no authentication and always responds with HTTP
        200 as long as the process is running.
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      description: >
        Returns every project belonging to the caller's organization, ordered by
        creation date (oldest first). Each project includes aggregated
        `taskCount` and `completedTaskCount` computed from tasks in the same org.
        Requires an active org membership; returns 401 if the session is missing
        or 403 if the user is not a member of any org.
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      description: >
        Creates a new project scoped to the caller's organization. The `orgId`
        is taken from the authenticated session - it cannot be supplied by the
        caller. Returns 400 if the request body is invalid.
      requestBody:
        required: true
        description: Fields for the new project. `name`, `status`, and `priority` are required.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      description: >
        Retrieves a single project by its numeric ID, scoped to the caller's
        organization. Returns 404 if the project does not exist or belongs to a
        different org (to prevent cross-tenant enumeration).
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the project.
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found or does not belong to the caller's organization.
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      description: >
        Partially updates one or more fields of an existing project. Only
        supplied fields are changed; omitted fields retain their current values.
        Returns 404 if the project does not exist or belongs to a different org.
        Returns 400 if the request body fails validation.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the project to update.
          schema:
            type: integer
      requestBody:
        required: true
        description: Partial set of project fields to update. All fields are optional.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found or does not belong to the caller's organization.
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      description: >
        Permanently deletes the project. Returns 404 if the project does not
        exist or belongs to a different org. Associated tasks are not
        automatically deleted - they retain their `projectId` reference.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the project to delete.
          schema:
            type: integer
      responses:
        "204":
          description: Project deleted successfully. No body returned.

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks with optional filters
      description: >
        Returns all tasks for the caller's organization, ordered by creation
        date (oldest first). Each task is enriched with `projectName` (from the
        linked project, if any, scoped to the same org) and a `commentCount`.
        Supply one or more query parameters to narrow the results. Returns 400
        if a query parameter value is not a recognized enum value.
      parameters:
        - name: projectId
          in: query
          description: Filter tasks by project ID. Returns only tasks linked to this project.
          schema:
            type: integer
        - name: status
          in: query
          description: >
            Filter by task status. One of `todo`, `in_progress`, `blocked`, or
            `done`.
          schema:
            type: string
        - name: priority
          in: query
          description: >
            Filter by task priority. One of `low`, `medium`, `high`, or
            `critical`.
          schema:
            type: string
        - name: category
          in: query
          description: >
            Filter by task category. One of `incident`, `change`,
            `maintenance`, `deployment`, `support`, or `other`.
          schema:
            type: string
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a new task
      description: >
        Creates a new task scoped to the caller's organization. If `projectId`
        is supplied it must belong to the same org, otherwise a 400 is returned.
        If `assignee` (an email address) is supplied it must match a member of
        the org, otherwise a 400 is returned. The `orgId` is set automatically
        from the session.
      requestBody:
        required: true
        description: Fields for the new task. `title`, `status`, `priority`, and `category` are required.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task by ID
      description: >
        Retrieves a single task by numeric ID, scoped to the caller's
        organization. Returns 404 if the task does not exist or belongs to a
        different org. The response includes the linked project name and comment
        count.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the task.
          schema:
            type: integer
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found or does not belong to the caller's organization.
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      description: >
        Partially updates one or more fields of a task. Only supplied fields are
        changed. If `projectId` is provided it must belong to the caller's org.
        If `assignee` is provided it must be an org member email. Returns 404 if
        the task is not found. Returns 400 if validation fails.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the task to update.
          schema:
            type: integer
      requestBody:
        required: true
        description: Partial set of task fields to update. All fields are optional.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found or does not belong to the caller's organization.
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      description: >
        Permanently deletes the task and returns 204 on success. Returns 404 if
        the task does not exist or belongs to a different org. Comments attached
        to the task are cascade-deleted by the database.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the task to delete.
          schema:
            type: integer
      responses:
        "204":
          description: Task deleted successfully. No body returned.

  /tasks/{id}/comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: List comments for a task
      description: >
        Returns all comments for the specified task, ordered by creation date
        (oldest first). The task must belong to the caller's organization;
        returns 404 if the task is not found or belongs to another org.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the task whose comments to list.
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags: [comments]
      summary: Add a comment to a task
      description: >
        Appends a new comment to the specified task. The task must belong to the
        caller's organization; returns 404 if the task is not found or belongs
        to another org. Returns 400 if the request body is invalid (e.g. empty
        `content`).
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the task to comment on.
          schema:
            type: integer
      requestBody:
        required: true
        description: Comment content and optional author display name.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /comments/{id}:
    delete:
      operationId: deleteComment
      tags: [comments]
      summary: Delete a comment
      description: >
        Permanently deletes a comment by its numeric ID. The server first
        verifies that the comment's parent task belongs to the caller's org;
        returns 404 if the comment is not found or if the parent task belongs to
        a different org (both cases use the same 404 to avoid leaking task
        existence). Returns 204 on success.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the comment to delete.
          schema:
            type: integer
      responses:
        "204":
          description: Comment deleted successfully. No body returned.

  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List all notes, optionally filtered by project or task
      description: >
        Returns notes visible to the caller within their organization. Visibility
        rules: the caller always sees their own notes and legacy notes with no
        owner; `public_read` and `public_write` notes from other org members are
        also returned. Private notes owned by other members are excluded. Results
        are ordered by `updatedAt` descending. Optionally filter to a specific
        project or task using query parameters.
      parameters:
        - name: projectId
          in: query
          required: false
          description: Return only notes linked to this project ID.
          schema:
            type: integer
        - name: taskId
          in: query
          required: false
          description: Return only notes linked to this task ID.
          schema:
            type: integer
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a new note
      description: >
        Creates a new note scoped to the caller's organization. The `createdBy`
        field is set automatically to the authenticated user. If `projectId` or
        `taskId` are supplied they must belong to the same org, otherwise a 400
        is returned. Notes default to `private` visibility if no `visibility` is
        specified.
      requestBody:
        required: true
        description: Note content and optional project/task association.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"

  /notes/{id}:
    get:
      operationId: getNote
      tags: [notes]
      summary: Get a note by ID
      description: >
        Retrieves a single note by numeric ID within the caller's organization.
        Returns 404 if the note does not exist or belongs to a different org.
        Returns 403 if the note exists but is `private` and owned by another
        user.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the note.
          schema:
            type: integer
      responses:
        "200":
          description: Note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          description: Note not found or does not belong to the caller's organization.
        "403":
          description: Note is private and owned by another user.
    patch:
      operationId: updateNote
      tags: [notes]
      summary: Update a note
      description: >
        Partially updates a note. Owners may change any field including
        `visibility`. Non-owners may edit content on `public_write` notes but
        cannot change `visibility` (returns 403). Non-owners cannot edit
        `private` or `public_read` notes (returns 403). If `projectId` or
        `taskId` are changed they must belong to the same org. Returns 404 if
        the note is not found.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the note to update.
          schema:
            type: integer
      requestBody:
        required: true
        description: Partial set of note fields to update. All fields are optional.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteUpdate"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "403":
          description: >
            Non-owner trying to edit a non-public_write note, or attempting
            to change visibility without ownership.
        "404":
          description: Note not found or does not belong to the caller's organization.
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note
      description: >
        Permanently deletes a note. Only the note owner can delete it; other
        org members receive a 403. Returns 404 if the note does not exist or
        belongs to a different org.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the note to delete.
          schema:
            type: integer
      responses:
        "204":
          description: Note deleted successfully. No body returned.
        "403":
          description: Only the note owner can delete this note.
        "404":
          description: Note not found or does not belong to the caller's organization.

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      description: >
        Returns aggregated statistics for the caller's organization in a single
        query: total task and project counts, task counts broken down by status
        and by priority, the number of overdue tasks (past due date and not
        `done`), and the number of currently active projects. Scoped strictly to
        the caller's org.
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      description: >
        Returns up to 10 recent activity events for the caller's organization,
        sorted by `createdAt` descending. Events are sourced from the 5 most
        recently created tasks, the 5 most recently added comments, and the 5
        most recently created projects, then merged and truncated. Each item
        carries a `type` (`task_created`, `comment_added`, or
        `project_created`), a human-readable `title`, and the `entityId` /
        `entityType` of the affected object.
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /tasks/overdue:
    get:
      operationId: getOverdueTasks
      tags: [tasks]
      summary: Get all overdue tasks
      description: >
        Returns all tasks in the caller's organization whose `dueDate` is
        strictly before today and whose `status` is not `done`, ordered by
        `dueDate` ascending (most overdue first). Enriched the same way as the
        general task list (project name, comment count).
      responses:
        "200":
          description: Overdue tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  /orgs:
    post:
      operationId: createOrg
      tags: [orgs]
      summary: Create a new organization (caller becomes admin)
      description: >
        Creates a new organization and automatically adds the authenticated user
        as its first `admin` member. Returns 409 if the caller already belongs
        to an organization (each user may belong to at most one org). Returns
        400 if `name` is missing or empty.
      requestBody:
        required: true
        description: Organization display name (1–200 characters).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgInput"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMeResponse"
        "409":
          description: Caller already belongs to an organization.

  /orgs/me:
    patch:
      operationId: renameOrg
      tags: [orgs]
      summary: Rename the current organization (admin only)
      description: >
        Updates the display name of the caller's organization. Requires `admin`
        role; returns 403 for non-admins. Returns 400 if `name` is empty or
        exceeds 200 characters.
      requestBody:
        required: true
        description: New organization name (1–200 characters).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameOrgInput"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          description: Invalid input - name missing or too long.
        "403":
          description: Caller is not an admin of the organization.
    get:
      operationId: getMyOrg
      tags: [orgs]
      summary: Get current org membership, role, and any pending invitation
      description: >
        Returns the caller's org context: their current organization and role if
        they are a member, or the oldest non-expired pending invitation targeted
        at their user ID or email if they are not. When neither condition
        applies, all three fields (`org`, `role`, `pendingInvitation`) are
        `null`. Useful for bootstrapping the UI on first load.
      responses:
        "200":
          description: Current org context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMeResponse"

  /orgs/members:
    get:
      operationId: listOrgMembers
      tags: [orgs]
      summary: List all members of the current organization
      description: >
        Returns all members of the caller's organization with their profile
        information, ordered by join date ascending. Requires org membership;
        both `admin` and `member` roles can call this endpoint.
      responses:
        "200":
          description: Member list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgMemberInfo"

  /orgs/invite:
    post:
      operationId: inviteOrgMember
      tags: [orgs]
      summary: Invite a user to the organization (admin only)
      description: >
        Creates a pending invitation valid for 7 days. Either `email` or
        `userId` must be provided; providing both is allowed. Returns 409 if
        the target user is already a member of the org. The invitation can be
        accepted via `/orgs/invitations/{token}/accept` by any authenticated
        user whose email or userId matches the invitation. Requires `admin`
        role.
      requestBody:
        required: true
        description: Target user's email address, userId, or both.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationInfo"

  /orgs/invitation-preview/{token}:
    get:
      operationId: getInvitationPreview
      tags: [orgs]
      summary: Get public preview info for an invitation token (no auth required)
      description: >
        Returns the organization name and expiry date for a pending, non-expired
        invitation token without requiring authentication. Used to render the
        "You've been invited to join {orgName}" page before the user logs in.
        Returns 404 if the token is not found, already accepted/declined, or
        expired.
      parameters:
        - name: token
          in: path
          required: true
          description: Opaque invitation token from the invitation email or link.
          schema:
            type: string
      responses:
        "200":
          description: Invitation preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "404":
          description: Invitation not found or expired.

  /orgs/invitations:
    get:
      operationId: listOrgInvitations
      tags: [orgs]
      summary: List pending invitations for the current organization (admin only)
      description: >
        Returns all non-expired, pending invitations for the caller's
        organization, ordered by creation date ascending. Requires `admin` role;
        returns 403 for non-admins.
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvitationInfo"
        "403":
          description: Caller is not an admin of the organization.

  /orgs/invitations/{id}:
    delete:
      operationId: cancelOrgInvitation
      tags: [orgs]
      summary: Cancel a pending invitation (admin only)
      description: >
        Permanently deletes a pending invitation by its UUID. Requires `admin`
        role. Returns 404 if the invitation does not exist, belongs to a
        different org, or is no longer pending. Returns 403 for non-admins.
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the invitation to cancel.
          schema:
            type: string
      responses:
        "204":
          description: Invitation cancelled successfully. No body returned.
        "403":
          description: Caller is not an admin of the organization.
        "404":
          description: Invitation not found or not pending.

  /orgs/invitations/{token}/accept:
    post:
      operationId: acceptOrgInvitation
      tags: [orgs]
      summary: Accept a pending invitation
      description: >
        Accepts the invitation identified by `token`, adds the caller to the
        organization as a `member`, and marks the invitation as `accepted`.
        Returns 404 if the token is not found, expired, or no longer pending.
        Returns 403 if the invitation is not addressed to the caller (checked by
        matching the caller's userId and email against `invitedUserId` and
        `invitedEmail`). Returns 409 if the caller already belongs to an
        organization.
      parameters:
        - name: token
          in: path
          required: true
          description: Opaque invitation token to accept.
          schema:
            type: string
      responses:
        "200":
          description: Invitation accepted, org membership returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMeResponse"
        "403":
          description: Invitation is not addressed to the authenticated user.
        "404":
          description: Invitation not found or expired.
        "409":
          description: Caller already belongs to an organization.

  /orgs/invitations/{token}/decline:
    post:
      operationId: declineOrgInvitation
      tags: [orgs]
      summary: Decline a pending invitation
      description: >
        Marks the invitation as `declined`. Returns 404 if the token is not
        found. Returns 403 if the invitation is not addressed to the caller.
        The caller does not need to be a member of any org to call this
        endpoint.
      parameters:
        - name: token
          in: path
          required: true
          description: Opaque invitation token to decline.
          schema:
            type: string
      responses:
        "200":
          description: Invitation declined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleSuccess"
        "403":
          description: Invitation is not addressed to the authenticated user.
        "404":
          description: Invitation not found.

  /orgs/members/{userId}:
    delete:
      operationId: removeOrgMember
      tags: [orgs]
      summary: Remove a member from the organization (admin only)
      description: >
        Removes the specified user from the caller's organization. Requires
        `admin` role. Returns 400 if the caller attempts to remove themselves.
        Returns 404 if the target user is not a member of the org.
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of the user to remove from the organization.
          schema:
            type: string
      responses:
        "204":
          description: Member removed successfully. No body returned.
        "400":
          description: Cannot remove yourself from the organization.
        "403":
          description: Caller is not an admin of the organization.
        "404":
          description: Target user is not a member of this organization.

  /orgs/members/{userId}/role:
    patch:
      operationId: updateOrgMemberRole
      tags: [orgs]
      summary: Change a member role, or transfer admin (admin only)
      description: >
        Updates the role of an org member to `admin` or `member`. Requires
        `admin` role. Promoting another user to `admin` does not remove the
        caller's own `admin` status - multiple admins are allowed. Returns 404
        if the target user is not a member of this org.
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of the member whose role to change.
          schema:
            type: string
      requestBody:
        required: true
        description: New role for the member.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRoleInput"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMemberInfo"
        "403":
          description: Caller is not an admin of the organization.
        "404":
          description: Target user is not a member of this organization.

  /orgs/leave:
    post:
      operationId: leaveOrg
      tags: [orgs]
      summary: Leave the current organization
      description: >
        Removes the authenticated user from their current organization. The
        caller's tasks and projects remain in the org but become unassigned.
        If the departing user is the last admin, they should transfer the admin
        role before leaving; the server does not enforce this constraint
        automatically.
      responses:
        "200":
          description: Left organization successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleSuccess"

  /webhooks/inbound/{token}/ingest:
    post:
      tags: [webhooks]
      operationId: ingestWebhookPayload
      summary: Ingest an external payload and create a task (public)
      description: >
        Public endpoint — no session required. Validates the HMAC-SHA256
        signature in `X-Opsly-Signature` (keyed on the webhook token), applies
        the webhook's task template to the payload, and creates a task in the
        webhook's org. Returns 401 on bad/missing signature, 403 if disabled.
      parameters:
        - name: token
          in: path
          required: true
          description: 64-character hex token embedded in the webhook URL.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookIngestPayload'
      responses:
        '201':
          description: Task created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookIngestSuccess'
        '400':
          description: Invalid payload.
        '401':
          description: Missing or invalid HMAC signature.
        '403':
          description: Webhook is disabled.
        '404':
          description: Webhook not found.

  /webhooks/inbound:
    get:
      tags: [webhooks]
      operationId: listInboundWebhooks
      summary: List inbound webhooks visible to the caller
      responses:
        '200':
          description: List of inbound webhooks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InboundWebhook'
    post:
      tags: [webhooks]
      operationId: createInboundWebhook
      summary: Create an inbound webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundWebhookInput'
      responses:
        '201':
          description: Inbound webhook created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundWebhook'

  /webhooks/inbound/{id}:
    get:
      tags: [webhooks]
      operationId: getInboundWebhook
      summary: Get an inbound webhook by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Inbound webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundWebhook'
        '404':
          description: Not found.
    patch:
      tags: [webhooks]
      operationId: updateInboundWebhook
      summary: Update an inbound webhook (creator only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundWebhookUpdate'
      responses:
        '200':
          description: Updated webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundWebhook'
        '403':
          description: Not the creator.
        '404':
          description: Not found.
    delete:
      tags: [webhooks]
      operationId: deleteInboundWebhook
      summary: Delete an inbound webhook (creator only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted.
        '403':
          description: Not the creator.
        '404':
          description: Not found.

  /webhooks/inbound/{id}/rotate-secret:
    post:
      tags: [webhooks]
      operationId: rotateInboundWebhookSecret
      summary: Rotate the token/secret for an inbound webhook (creator only)
      description: >
        Issues a new 64-character hex token and returns the updated webhook.
        The old ingest URL is immediately invalidated.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated webhook with new token and ingest URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundWebhook'
        '403':
          description: Not the creator.
        '404':
          description: Not found.

  /webhooks/outbound:
    get:
      tags: [webhooks]
      operationId: listOutboundWebhooks
      summary: List outbound webhooks visible to the caller
      responses:
        '200':
          description: List of outbound webhooks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutboundWebhook'
    post:
      tags: [webhooks]
      operationId: createOutboundWebhook
      summary: Create an outbound webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundWebhookInput'
      responses:
        '201':
          description: Outbound webhook created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundWebhook'

  /webhooks/outbound/{id}:
    get:
      tags: [webhooks]
      operationId: getOutboundWebhook
      summary: Get an outbound webhook by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Outbound webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundWebhook'
        '404':
          description: Not found.
    patch:
      tags: [webhooks]
      operationId: updateOutboundWebhook
      summary: Update an outbound webhook (creator only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundWebhookUpdate'
      responses:
        '200':
          description: Updated webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundWebhook'
        '403':
          description: Not the creator.
        '404':
          description: Not found.
    delete:
      tags: [webhooks]
      operationId: deleteOutboundWebhook
      summary: Delete an outbound webhook (creator only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted.
        '403':
          description: Not the creator.
        '404':
          description: Not found.

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: >
        Opaque session token in the form `Bearer <sid>`. Used by mobile clients
        in place of the session cookie. Passed to the session middleware which
        resolves the user; ignored if no matching session exists.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: >
        Browser session cookie set by the `/login` callback. The session
        middleware reads this cookie to resolve the authenticated user.
      schema:
        type: string
  schemas:
    AuthUser:
      description: Profile of the currently authenticated user as stored in the session.
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
          description: Unique user ID from the OIDC provider (`sub` claim).
        email:
          type: [string, 'null']
          description: User's email address. May be null if the provider did not supply one.
        firstName:
          type: [string, 'null']
          description: User's given name. Null if not provided by the OIDC provider.
        lastName:
          type: [string, 'null']
          description: User's family name. Null if not provided by the OIDC provider.
        profileImageUrl:
          type: [string, 'null']
          description: URL of the user's profile picture. Null if not provided.
    AuthUserEnvelope:
      description: >
        Wrapper returned by `GET /auth/user`. The `user` field is null when no
        valid session exists.
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      description: >
        OIDC authorization code and associated PKCE parameters captured by the
        mobile app after the user completes the in-app browser login flow.
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
          description: Authorization code returned by the OIDC provider.
        code_verifier:
          type: string
          minLength: 1
          description: PKCE code verifier that was used to generate the code challenge.
        redirect_uri:
          type: string
          minLength: 1
          description: Redirect URI registered with the OIDC provider for this flow.
        state:
          type: string
          minLength: 1
          description: Opaque state value used for CSRF protection during the flow.
        nonce:
          type: string
          minLength: 1
          description: Optional nonce included in the authorization request for replay protection.
    MobileTokenExchangeSuccess:
      description: Successful mobile token exchange response containing the opaque session token.
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: >
            Opaque session ID (`sid`). Include this in the `Authorization:
            Bearer <token>` header on all subsequent authenticated requests.
    LogoutSuccess:
      description: Confirms a successful logout operation.
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
          description: Always `true` when the logout request was processed.
    ErrorEnvelope:
      description: Standard error response body returned on 4xx and 5xx responses.
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message describing what went wrong.
    HealthStatus:
      description: Server health status payload.
      type: object
      properties:
        status:
          type: string
          description: >
            Health status string. Returns `"ok"` when the server is healthy.
      required:
        - status

    Project:
      description: An IT project grouping related tasks within an organization.
      type: object
      required: [id, name, status, priority, createdAt, updatedAt]
      properties:
        id:
          type: integer
          description: Auto-incremented primary key.
        name:
          type: string
          description: Human-readable project name.
        description:
          type: ["string", "null"]
          description: Optional longer description of the project's scope and goals.
        status:
          type: string
          enum: [planning, active, on_hold, completed]
          description: >
            Lifecycle status of the project. `planning` - not yet started;
            `active` - work is ongoing; `on_hold` - temporarily paused;
            `completed` - all work finished.
        priority:
          type: string
          enum: [low, medium, high, critical]
          description: >
            Importance level of the project. `critical` projects should be
            addressed immediately; `low` can be deferred.
        dueDate:
          type: ["string", "null"]
          description: Target completion date in `YYYY-MM-DD` format. Null if no deadline is set.
        taskCount:
          type: integer
          description: Total number of tasks linked to this project within the org.
        completedTaskCount:
          type: integer
          description: Number of tasks linked to this project with status `done`.
        createdAt:
          type: string
          description: ISO 8601 timestamp when the project was created.
        updatedAt:
          type: string
          description: ISO 8601 timestamp when the project was last updated.

    ProjectInput:
      description: Fields required to create a new project.
      type: object
      required: [name, status, priority]
      properties:
        name:
          type: string
          minLength: 1
          description: Display name of the project (must be non-empty).
        description:
          type: string
          description: Optional description of the project's scope and goals.
        status:
          type: string
          enum: [planning, active, on_hold, completed]
          description: Initial lifecycle status of the project.
        priority:
          type: string
          enum: [low, medium, high, critical]
          description: Importance level of the project.
        dueDate:
          type: string
          description: Target completion date in `YYYY-MM-DD` format.

    ProjectUpdate:
      description: Partial update for an existing project. All fields are optional.
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: New display name for the project.
        description:
          type: string
          description: Updated description.
        status:
          type: string
          enum: [planning, active, on_hold, completed]
          description: New lifecycle status.
        priority:
          type: string
          enum: [low, medium, high, critical]
          description: New priority level.
        dueDate:
          type: string
          description: New target completion date in `YYYY-MM-DD` format.

    Task:
      description: >
        An individual work item within an organization, optionally linked to a
        project. Enriched with the project name and the number of comments.
      type: object
      required: [id, orgTaskNumber, title, status, priority, category, createdAt, updatedAt]
      properties:
        id:
          type: integer
          description: Auto-incremented primary key.
        orgTaskNumber:
          type: integer
          description: >
            Per-organization sequential task number. Starts at 1 for each org
            and increments with each new task. Used to display the TSK-## badge.
            Unique within an org but not globally unique.
        projectId:
          type: ["integer", "null"]
          description: ID of the linked project. Null if the task is not associated with a project.
        projectName:
          type: ["string", "null"]
          description: >
            Display name of the linked project, resolved at query time and
            scoped to the org. Null if no project is linked or the project
            belongs to another org.
        title:
          type: string
          description: Short, descriptive title of the task.
        description:
          type: ["string", "null"]
          description: Optional detailed description of the work to be done.
        status:
          type: string
          enum: [todo, in_progress, blocked, done]
          description: >
            Current state of the task. `todo` - not yet started; `in_progress`
            - actively being worked on; `blocked` - waiting on an external
            dependency; `done` - work is complete.
        priority:
          type: string
          enum: [low, medium, high, critical]
          description: >
            Urgency of the task. `critical` tasks require immediate attention;
            `low` tasks can be deferred.
        category:
          type: string
          enum: [incident, change, maintenance, deployment, support, other]
          description: >
            IT operational category. `incident` - unplanned disruption;
            `change` - planned modification; `maintenance` - routine upkeep;
            `deployment` - software release; `support` - user-facing assistance;
            `other` - anything that doesn't fit.
        assignee:
          type: ["string", "null"]
          description: >
            Email address of the org member assigned to this task. Must match
            a current org member when set. Null if unassigned.
        dueDate:
          type: ["string", "null"]
          description: Task deadline in `YYYY-MM-DD` format. Null if no deadline is set.
        commentCount:
          type: integer
          description: Number of comments attached to this task.
        createdAt:
          type: string
          description: ISO 8601 timestamp when the task was created.
        updatedAt:
          type: string
          description: ISO 8601 timestamp when the task was last updated.

    TaskInput:
      description: Fields required to create a new task.
      type: object
      required: [title, status, priority, category]
      properties:
        projectId:
          type: integer
          description: >
            ID of the project to link this task to. Must belong to the caller's
            org; omit to create an unlinked task.
        title:
          type: string
          minLength: 1
          description: Short, descriptive title for the task (must be non-empty).
        description:
          type: string
          description: Optional detailed description of the work to be done.
        status:
          type: string
          enum: [todo, in_progress, blocked, done]
          description: Initial status of the task.
        priority:
          type: string
          enum: [low, medium, high, critical]
          description: Urgency level of the task.
        category:
          type: string
          enum: [incident, change, maintenance, deployment, support, other]
          description: IT operational category for the task.
        assignee:
          type: string
          description: >
            Email address of the org member to assign. Must match an existing
            org member; omit to leave unassigned.
        dueDate:
          type: string
          description: Task deadline in `YYYY-MM-DD` format.

    TaskUpdate:
      description: Partial update for an existing task. All fields are optional.
      type: object
      properties:
        projectId:
          type: ["integer", "null"]
          description: >
            Updated project link. Pass `null` to unlink from the current
            project. Must belong to the caller's org if non-null.
        title:
          type: string
          minLength: 1
          description: New task title.
        description:
          type: string
          description: Updated description.
        status:
          type: string
          enum: [todo, in_progress, blocked, done]
          description: New task status.
        priority:
          type: string
          enum: [low, medium, high, critical]
          description: New priority level.
        category:
          type: string
          enum: [incident, change, maintenance, deployment, support, other]
          description: New IT operational category.
        assignee:
          type: string
          description: >
            Updated assignee email. Must match an org member. Pass an empty
            value or omit to leave unchanged.
        dueDate:
          type: string
          description: Updated deadline in `YYYY-MM-DD` format.

    Comment:
      description: A comment attached to a task.
      type: object
      required: [id, taskId, content, createdAt]
      properties:
        id:
          type: integer
          description: Auto-incremented primary key.
        taskId:
          type: integer
          description: ID of the task this comment belongs to.
        content:
          type: string
          description: Plain-text body of the comment.
        author:
          type: ["string", "null"]
          description: >
            Display name or identifier of the comment author. Not validated
            against org members. Null if no author was provided at creation
            time.
        createdAt:
          type: string
          description: ISO 8601 timestamp when the comment was posted.

    CommentInput:
      description: Fields required to add a comment to a task.
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          description: Plain-text body of the comment (must be non-empty).
        author:
          type: string
          description: >
            Optional display name for the author. Not validated against org
            membership; purely informational.

    NoteVisibility:
      type: string
      enum: [private, public_read, public_write]
      description: >
        Controls who can see and edit a note within the organization.
        `private` - only the owner can read or write; `public_read` - all org
        members can read but only the owner can write; `public_write` - all org
        members can read and write (but only the owner can delete or change
        visibility).

    Note:
      description: >
        A rich-text scratch-pad note scoped to an organization and optionally
        linked to a project or task.
      type: object
      required: [id, title, content, visibility, isOwner, createdAt, updatedAt]
      properties:
        id:
          type: integer
          description: Auto-incremented primary key.
        title:
          type: string
          description: Short descriptive title for the note.
        content:
          type: string
          description: Rich-text body of the note (typically stored as HTML or Markdown).
        visibility:
          $ref: "#/components/schemas/NoteVisibility"
        isOwner:
          type: boolean
          description: >
            True when the caller is the note owner (or the note has no owner,
            i.e. a legacy note). Controls whether the caller can change
            visibility or delete the note.
        createdBy:
          type: ["string", "null"]
          description: >
            User ID of the note creator. Null for legacy notes created before
            ownership tracking was introduced.
        projectId:
          type: ["integer", "null"]
          description: ID of the linked project. Null if not associated with a project.
        taskId:
          type: ["integer", "null"]
          description: ID of the linked task. Null if not associated with a task.
        createdAt:
          type: string
          description: ISO 8601 timestamp when the note was created.
        updatedAt:
          type: string
          description: ISO 8601 timestamp when the note was last updated.

    NoteInput:
      description: Fields for creating a new note. All fields are optional except that a useful note should have at least a title or content.
      type: object
      properties:
        title:
          type: string
          minLength: 1
          description: Short descriptive title for the note.
        content:
          type: string
          description: Rich-text body of the note.
        visibility:
          $ref: "#/components/schemas/NoteVisibility"
        projectId:
          type: integer
          description: >
            Link this note to a project. Must belong to the caller's org.
        taskId:
          type: integer
          description: >
            Link this note to a task. Must belong to the caller's org.

    NoteUpdate:
      description: Partial update for an existing note. All fields are optional.
      type: object
      properties:
        title:
          type: string
          minLength: 1
          description: New title for the note.
        content:
          type: string
          description: Updated rich-text body.
        visibility:
          $ref: "#/components/schemas/NoteVisibility"
        projectId:
          type: ["integer", "null"]
          description: >
            Updated project link. Pass `null` to remove the association. Must
            belong to the caller's org if non-null. Only the note owner can
            change this.
        taskId:
          type: ["integer", "null"]
          description: >
            Updated task link. Pass `null` to remove the association. Must
            belong to the caller's org if non-null. Only the note owner can
            change this.

    DashboardSummary:
      description: Aggregated statistics for the caller's organization, computed in real time.
      type: object
      required: [totalTasks, totalProjects, tasksByStatus, tasksByPriority, overdueCount, activeProjects]
      properties:
        totalTasks:
          type: integer
          description: Total number of tasks in the organization regardless of status.
        totalProjects:
          type: integer
          description: Total number of projects in the organization regardless of status.
        tasksByStatus:
          type: object
          description: Task counts grouped by status value.
          properties:
            todo:
              type: integer
              description: Number of tasks with status `todo`.
            in_progress:
              type: integer
              description: Number of tasks with status `in_progress`.
            blocked:
              type: integer
              description: Number of tasks with status `blocked`.
            done:
              type: integer
              description: Number of tasks with status `done`.
          required: [todo, in_progress, blocked, done]
        tasksByPriority:
          type: object
          description: Task counts grouped by priority level.
          properties:
            low:
              type: integer
              description: Number of tasks with priority `low`.
            medium:
              type: integer
              description: Number of tasks with priority `medium`.
            high:
              type: integer
              description: Number of tasks with priority `high`.
            critical:
              type: integer
              description: Number of tasks with priority `critical`.
          required: [low, medium, high, critical]
        overdueCount:
          type: integer
          description: >
            Number of tasks whose `dueDate` is before today and whose status is
            not `done`.
        activeProjects:
          type: integer
          description: Number of projects with status `active`.

    ActivityItem:
      description: >
        A single event in the organization's recent activity feed. Events are
        sourced from recently created tasks, comments, and projects.
      type: object
      required: [id, type, title, entityId, entityType, createdAt]
      properties:
        id:
          type: integer
          description: >
            Synthetic unique ID for the activity item. Task IDs are used
            directly; comment IDs are offset by 100,000 and project IDs by
            200,000 to avoid collisions in the merged list.
        type:
          type: string
          description: >
            Event type. One of `task_created`, `comment_added`, or
            `project_created`.
        title:
          type: string
          description: Human-readable description of the activity event.
        entityId:
          type: integer
          description: Numeric ID of the primary entity associated with this event.
        entityType:
          type: string
          description: >
            Type of the primary entity. One of `task` or `project`.
        createdAt:
          type: string
          description: ISO 8601 timestamp of when the event occurred.

    InvitationPreview:
      description: >
        Public preview of an invitation, returned without authentication so the
        invite landing page can display the organization name before the user
        logs in.
      type: object
      required: [orgName, expiresAt]
      properties:
        orgName:
          type: string
          description: Display name of the organization the user is being invited to join.
        expiresAt:
          type: string
          description: ISO 8601 timestamp when the invitation expires.

    RenameOrgInput:
      description: Request body for renaming an organization.
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: New display name for the organization (1–200 characters).

    Organization:
      description: An organization record.
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          description: UUID of the organization.
        name:
          type: string
          description: Display name of the organization.
        createdAt:
          type: string
          description: ISO 8601 timestamp when the organization was created.

    PendingInvitation:
      description: Summary of a pending invitation shown to a user who has not yet joined an org.
      type: object
      required: [id, orgId, orgName, token, expiresAt]
      properties:
        id:
          type: string
          description: UUID of the invitation.
        orgId:
          type: string
          description: UUID of the organization that sent the invitation.
        orgName:
          type: string
          description: Display name of the inviting organization.
        token:
          type: string
          description: Opaque token used to accept or decline the invitation.
        expiresAt:
          type: string
          description: ISO 8601 timestamp when this invitation expires.

    OrgMeResponse:
      description: >
        Current organization context for the authenticated user. Exactly one of
        `org` (with a non-null `role`) or `pendingInvitation` will be non-null;
        all three are null when the user has no org relationship.
      type: object
      required: [org, role, pendingInvitation]
      properties:
        org:
          oneOf:
            - $ref: '#/components/schemas/Organization'
            - type: 'null'
          description: The organization the user belongs to. Null if they are not a member.
        role:
          oneOf:
            - type: string
              enum: [admin, member]
            - type: 'null'
          description: >
            The caller's role in the organization. `admin` can manage members
            and invitations; `member` has read/write access to projects and
            tasks. Null when `org` is null.
        pendingInvitation:
          oneOf:
            - $ref: '#/components/schemas/PendingInvitation'
            - type: 'null'
          description: >
            The oldest non-expired pending invitation for this user. Present
            only when the user is not yet a member of any org. Null otherwise.

    OrgMemberInfo:
      description: Profile and membership information for a single org member.
      type: object
      required: [userId, role, joinedAt]
      properties:
        userId:
          type: string
          description: Unique user ID of the member.
        role:
          type: string
          enum: [admin, member]
          description: The member's role within the organization.
        joinedAt:
          type: string
          description: ISO 8601 timestamp when the user joined the organization.
        firstName:
          type: ["string", "null"]
          description: Member's given name. Null if not set in their profile.
        lastName:
          type: ["string", "null"]
          description: Member's family name. Null if not set in their profile.
        email:
          type: ["string", "null"]
          description: Member's email address. Null if not set in their profile.
        profileImageUrl:
          type: ["string", "null"]
          description: URL of the member's profile picture. Null if not set.

    InvitationInfo:
      description: Full invitation record visible to admins.
      type: object
      required: [id, orgId, token, status, expiresAt, createdAt]
      properties:
        id:
          type: string
          description: UUID of the invitation.
        orgId:
          type: string
          description: UUID of the organization that issued the invitation.
        invitedEmail:
          type: ["string", "null"]
          description: Email address the invitation was sent to. Null if the invitation was created by userId only.
        invitedUserId:
          type: ["string", "null"]
          description: User ID the invitation is addressed to. Null if the invitation was created by email only.
        token:
          type: string
          description: Opaque token used to accept or decline the invitation.
        status:
          type: string
          enum: [pending, accepted, declined]
          description: >
            Current state of the invitation. `pending` - awaiting a response;
            `accepted` - the invitee joined the org; `declined` - the invitee
            rejected it.
        expiresAt:
          type: string
          description: ISO 8601 timestamp when the invitation expires (7 days after creation).
        createdAt:
          type: string
          description: ISO 8601 timestamp when the invitation was issued.

    OrgInput:
      description: Request body for creating a new organization.
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Display name for the new organization (1–200 characters).

    InviteMemberInput:
      description: >
        Target user to invite. At least one of `email` or `userId` must be
        provided; both may be supplied together.
      type: object
      properties:
        email:
          type: string
          description: Email address of the user to invite.
        userId:
          type: string
          description: User ID of the user to invite.

    UpdateMemberRoleInput:
      description: Request body for changing an org member's role.
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member]
          description: >
            New role for the member. Promoting to `admin` grants full
            organization management permissions. Demoting to `member` restricts
            access to standard read/write operations on projects and tasks.

    SimpleSuccess:
      description: Generic success acknowledgement with no additional data.
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          description: Always `true` when the operation completed successfully.

    WebhookVisibility:
      type: string
      enum: [private, public_read, public_write]
      description: >
        `private` - only the creator can read or write; `public_read` - all org
        members can read but only the creator can edit; `public_write` - all org
        members can read and use the webhook.

    WebhookTaskTemplate:
      description: >
        Controls how an inbound payload is mapped to task fields.
        All fields are optional; absent fields fall back to sensible defaults.
      type: object
      properties:
        titleField:
          type: string
          description: Dot-notation JSON path in the payload used as the task title (e.g. "alertname").
        defaultTitle:
          type: string
          description: Static title fallback when the payload has no title field.
        descriptionField:
          type: string
          description: Dot-notation path used as the task description.
        defaultPriority:
          type: string
          enum: [low, medium, high, critical]
          description: Priority applied when the payload doesn't specify one.
        defaultCategory:
          type: string
          enum: [incident, change, maintenance, deployment, support, other]
          description: Category applied when the payload doesn't specify one.
        fieldMapping:
          type: object
          additionalProperties:
            type: string
          description: >
            Free-form mapping of dot-notation payload paths to task field names.
            Example - { "labels.severity": "priority" }.

    InboundWebhook:
      description: An inbound webhook that accepts external payloads and creates tasks.
      type: object
      required: [id, orgId, createdBy, name, token, taskTemplate, visibility, enabled, isOwner, ingestUrl, createdAt, updatedAt]
      properties:
        id:
          type: integer
        orgId:
          type: string
        projectId:
          type: ["integer", "null"]
          description: Optional project the created tasks are filed under.
        createdBy:
          type: string
        name:
          type: string
        token:
          type: string
          description: 64-character hex token. Embedded in the ingest URL and used as the HMAC key.
        taskTemplate:
          $ref: '#/components/schemas/WebhookTaskTemplate'
        visibility:
          $ref: '#/components/schemas/WebhookVisibility'
        enabled:
          type: boolean
        isOwner:
          type: boolean
          description: True when the authenticated user is the creator.
        ingestUrl:
          type: string
          description: Relative path for the public ingest endpoint. Prepend the API origin to get the full URL.
        createdAt:
          type: string
        updatedAt:
          type: string

    InboundWebhookInput:
      description: Fields for creating an inbound webhook.
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        projectId:
          type: integer
          description: Optional project to pin ingest-created tasks to.
        visibility:
          $ref: '#/components/schemas/WebhookVisibility'
        enabled:
          type: boolean
          default: true
        taskTemplate:
          $ref: '#/components/schemas/WebhookTaskTemplate'

    InboundWebhookUpdate:
      description: Partial update for an inbound webhook.
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        projectId:
          type: ["integer", "null"]
        visibility:
          $ref: '#/components/schemas/WebhookVisibility'
        enabled:
          type: boolean
        taskTemplate:
          $ref: '#/components/schemas/WebhookTaskTemplate'

    OutboundWebhook:
      description: An outbound webhook that POSTs signed event payloads to an external URL.
      type: object
      required: [id, orgId, createdBy, name, url, secret, events, visibility, enabled, isOwner, createdAt, updatedAt]
      properties:
        id:
          type: integer
        orgId:
          type: string
        projectId:
          type: ["integer", "null"]
          description: Optional project filter. When set, only fires for events on this project.
        createdBy:
          type: string
        name:
          type: string
        url:
          type: string
          description: Target URL Opsly will POST event payloads to.
        secret:
          type: string
          description: 64-character hex secret used to sign outbound payloads (X-Opsly-Signature).
        events:
          type: array
          items:
            type: string
            enum: [task.created, task.updated, task.status_changed, task.assigned, task.commented, project.created, project.updated]
          description: Event types this webhook subscribes to.
        visibility:
          $ref: '#/components/schemas/WebhookVisibility'
        enabled:
          type: boolean
        isOwner:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    OutboundWebhookInput:
      description: Fields for creating an outbound webhook.
      type: object
      required: [name, url, events]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        url:
          type: string
          description: Target URL for event delivery.
        projectId:
          type: integer
          description: Optional project filter.
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum: [task.created, task.updated, task.status_changed, task.assigned, task.commented, project.created, project.updated]
        visibility:
          $ref: '#/components/schemas/WebhookVisibility'
        enabled:
          type: boolean
          default: true

    OutboundWebhookUpdate:
      description: Partial update for an outbound webhook.
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        url:
          type: string
        projectId:
          type: ["integer", "null"]
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum: [task.created, task.updated, task.status_changed, task.assigned, task.commented, project.created, project.updated]
        visibility:
          $ref: '#/components/schemas/WebhookVisibility'
        enabled:
          type: boolean

    WebhookIngestPayload:
      description: >
        JSON payload POSTed to the ingest endpoint by an external system.
        Only `title` is required; all other fields are optional and supplement or
        override the webhook's task template.
      type: object
      properties:
        title:
          type: string
          description: Task title. Required unless the webhook template specifies a titleField.
        description:
          type: string
        priority:
          type: string
          enum: [low, medium, high, critical]
        category:
          type: string
          enum: [incident, change, maintenance, deployment, support, other]
        dueDate:
          type: string
          description: Task deadline in YYYY-MM-DD format.
      additionalProperties: true

    WebhookIngestSuccess:
      description: Confirmation returned after a successful ingest.
      type: object
      required: [taskId, orgTaskNumber, title]
      properties:
        taskId:
          type: integer
        orgTaskNumber:
          type: integer
          description: The TSK-## number assigned to the created task.
        title:
          type: string
