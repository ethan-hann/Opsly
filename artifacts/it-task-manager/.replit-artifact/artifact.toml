kind = "web"
previewPath = "/"
title = "IT Task Manager"
version = "1.0.0"
id = "artifacts/it-task-manager"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20999

[services.development]
run = "pnpm --filter @workspace/it-task-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/it-task-manager", "run", "build" ]
serve = "static"
publicDir = "artifacts/it-task-manager/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20999"
BASE_PATH = "/"
