# CodeQL code scanning (advanced setup).
# Both languages here are interpreted (build-mode: none), so there are no
# compile steps: CodeQL scans the source tree directly.
name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Weekly baseline scan so alerts stay fresh even without new commits.
  schedule:
    - cron: "35 8 * * 3"

# Cancel superseded runs on the same ref (e.g. a new push to a PR branch).
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload code-scanning results
      packages: read # fetch CodeQL query packs
      contents: read # check out the repo

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # To add extra query suites, uncomment (prefix with "+" to append
          # rather than replace the default suite):
          # queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
