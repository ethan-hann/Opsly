# Toolchain prep for the GitHub Copilot coding agent (the `opsly-plan-executor`
# agent in .github/agents/). GitHub runs the job named exactly `copilot-setup-steps`
# — read from the DEFAULT BRANCH — as the first steps of the agent's job, in the same
# environment the agent then works in. Its only job here is to put Node 24 and pnpm on
# PATH so the agent never again hits "pnpm is not available in this environment."
#
# Deliberately minimal:
#   * No `actions/checkout` — Copilot checks the repo out itself; a custom checkout
#     step was failing the whole setup ("Check out repository custom setup step failed").
#   * No `pnpm install` here — the repo isn't guaranteed present during setup steps, so
#     the agent runs install / codegen / build / test itself once it's working in the
#     checked-out worktree (see .github/agents/opsly-plan-executor.agent.md).
#   * pnpm is installed via npm, not corepack (corepack's signature check fails in the
#     agent sandbox).
#
# NOTE: Copilot only reads this file from the default branch, so changes take effect on
# the NEXT agent run after they merge to main — not retroactively.
name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job name MUST be `copilot-setup-steps` or Copilot will not pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # Repo requires Node 24 (engines ">=24", .nvmrc, preinstall.js guard).
          node-version: 24
          # No repo checked out during setup, and installing pnpm ourselves — so
          # disable setup-node's package-manager cache auto-detection (it would try
          # to run `pnpm store path` before pnpm exists and fail).
          package-manager-cache: false

      - name: Install pnpm
        run: npm install -g pnpm@10.34.5
