# Environment prep for the GitHub Copilot coding agent.
#
# GitHub runs the job named exactly `copilot-setup-steps` before the agent
# starts, in the same ephemeral environment the agent then works in. Its whole
# purpose is to make the toolchain available so the agent can run repo checks
# itself instead of handing them back to you.
#
# This is why Copilot reported "pnpm not on PATH" and a corepack signature
# mismatch: nothing installed pnpm. We install it directly via npm, which
# sidesteps the corepack key/signature bug entirely.
#
# After this runs, the agent can execute:
#   pnpm --filter @workspace/api-server run typecheck
#   pnpm --filter @workspace/api-server run test
#   pnpm --filter @workspace/api-server run build
name: Copilot setup steps

on:
  # Lets you validate the setup manually from the Actions tab.
  workflow_dispatch:
  # Re-run when the setup itself changes.
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job name MUST be `copilot-setup-steps` for Copilot to pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # ---------------------------------------------------------------------
    # Optional: uncomment to run the live-Postgres integration suites
    # (src/**/*-db.test.ts and task-events-index.test.ts). Without a
    # DATABASE_URL these 3 suites auto-skip and everything else still runs,
    # so this is only needed for full coverage.
    #
    # For the agent's own `pnpm test` to see the DB, DATABASE_URL must be
    # exposed to the agent session — set it in the repo's Copilot environment
    # (Settings > Environments) to match the service below.
    # ---------------------------------------------------------------------
    # services:
    #   postgres:
    #     image: postgres:16
    #     env:
    #       POSTGRES_USER: postgres
    #       POSTGRES_PASSWORD: postgres
    #       POSTGRES_DB: opsly_test
    #     ports:
    #       - 5432:5432
    #     options: >-
    #       --health-cmd "pg_isready -U postgres"
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        # Pinned to the version that produced pnpm-lock.yaml. Installed via npm
        # rather than corepack to avoid the corepack signature-verification bug.
        run: npm install -g pnpm@10.34.5

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript project references
        # Warms the workspace so `typecheck` and `build` are fast and green.
        run: pnpm run typecheck:libs

      # ---------------------------------------------------------------------
      # Optional companion to the Postgres service above: create the schema so
      # the live-DB suites can run. Uncomment together with `services:`.
      # ---------------------------------------------------------------------
      # - name: Push database schema
      #   env:
      #     DATABASE_URL: postgres://postgres:postgres@localhost:5432/opsly_test
      #   run: pnpm --filter @workspace/db run push-force
