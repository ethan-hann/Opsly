# Continuous integration: typecheck, build, and test every pull request
# before changes land. A required status check on this workflow is what
# actually blocks merging red PRs — see the note at the bottom.
#
# We deliberately do NOT run on push to main: a PR is already tested before it
# merges, so re-running the identical checks on the resulting merge commit is
# pure duplication. Enforce "Require branches to be up to date before merging"
# in branch protection so the PR is tested against current main — that keeps
# main green without a redundant post-merge run.
name: CI

on:
  pull_request:

# Cancel superseded runs on the same ref (e.g. new push to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # A live Postgres so the integration suites (src/**/*-db.test.ts and the
    # @workspace/db tests) run instead of auto-skipping.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # vitest.config.ts keys off DATABASE_URL to decide whether to run the
      # live-DB suites; drizzle push-force reads it too.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/opsly_test
      # The frontend's vite.config.ts throws unless PORT and BASE_PATH are set,
      # even for a production build. Values mirror Dockerfile.frontend.
      PORT: "3000"
      BASE_PATH: /

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Full history so the docs-only detection below can diff the PR head
          # against its merge-base with the target branch.
          fetch-depth: 0

      # Docs/planning-only PRs don't need the build+test pipeline, but this job
      # is a REQUIRED status check (ruleset "Protect main" requires the
      # `build-and-test` context). We therefore can't skip the workflow with a
      # trigger-level `paths-ignore` — the required context would never report
      # and the PR would deadlock on "Expected — Waiting for status." Instead the
      # job always runs (so the context is always reported), and the heavy steps
      # below are gated on this step: they only execute when a non-docs file
      # changed. A docs-only PR runs checkout → detect → done, reports green in
      # well under a minute, and satisfies the required check.
      - name: Detect non-docs changes
        id: changes
        run: |
          base_sha='${{ github.event.pull_request.base.sha }}'
          head_sha='${{ github.event.pull_request.head.sha }}'
          base="$(git merge-base "$base_sha" "$head_sha" 2>/dev/null || true)"
          if [ -z "$base" ]; then
            echo "Unable to determine merge-base; running full pipeline."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$base" "$head_sha" 2>/dev/null || true)"
          echo "Changed files:"
          echo "$files"
          # "docs" = anything under planning/, .agents/, task-review/, or any
          # .md file anywhere. If every changed file matches, skip the pipeline.
          if echo "$files" | grep -qvE '(^planning/|^\.agents/|^task-review/|\.md$)'; then
            echo "Code/config changed — running full pipeline."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs/planning only — skipping build & tests."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v5
        with:
          # Repo requires Node 24 (engines ">=24", .nvmrc, preinstall.js guard).
          node-version: 24
          # We install pnpm ourselves below. When package.json declares
          # `packageManager: pnpm@…`, setup-node's cache auto-detection would run
          # `pnpm store path` before pnpm exists and fail ("Unable to locate
          # executable file: pnpm"); disabling it avoids that ordering trap.
          package-manager-cache: false

      - name: Install pnpm
        if: steps.changes.outputs.code == 'true'
        # Via npm (not corepack — its signature check is unreliable), and with an
        # explicit version so this works whether or not package.json carries a
        # `packageManager` field (it does on Node-24 branches, not yet on main).
        run: npm install -g pnpm@10.34.5

      - name: Locate pnpm store
        if: steps.changes.outputs.code == 'true'
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck + API codegen drift check
        if: steps.changes.outputs.code == 'true'
        run: |
          pnpm --filter @workspace/api-spec run codegen
          git diff --exit-code \
            lib/api-zod/src/generated \
            lib/api-zod/src/index.ts \
            lib/api-client-react/src/generated \
            lib/api-client-react/src/index.ts

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: pnpm -r --if-present run build

      - name: Boot smoke check (api-server)
        if: steps.changes.outputs.code == 'true'
        run: pnpm --filter @workspace/api-server run smoke

      - name: Push database schema
        if: steps.changes.outputs.code == 'true'
        run: pnpm --filter @workspace/db run push-force

      # Unit tests with coverage gate (api-server, it-task-manager). The
      # per-package thresholds in each vitest.config.ts fail the build if
      # coverage drops below the floor — this is what forces new code to ship
      # with tests. Ratchet the thresholds up over time.
      - name: Test + coverage
        if: steps.changes.outputs.code == 'true'
        run: pnpm -r --if-present run test:coverage

      # DB integration suites live in @workspace/db and have no coverage gate;
      # they run against the Postgres service above.
      - name: Test (db integration)
        if: steps.changes.outputs.code == 'true'
        run: pnpm --filter @workspace/db run test

      - name: Coverage summary
        if: ${{ always() && steps.changes.outputs.code == 'true' }}
        run: |
          for pkg in artifacts/api-server artifacts/it-task-manager; do
            f="$pkg/coverage/coverage-summary.json"
            [ -f "$f" ] || continue
            echo "### Coverage — $pkg" >> "$GITHUB_STEP_SUMMARY"
            node -e '
              const t=require("./"+process.argv[1]).total;
              const row=(k)=>`| ${k} | ${t[k].pct}% (${t[k].covered}/${t[k].total}) |`;
              console.log("| metric | coverage |\n|---|---|");
              for (const k of ["lines","statements","functions","branches"]) console.log(row(k));
            ' "$f" >> "$GITHUB_STEP_SUMMARY"
          done
