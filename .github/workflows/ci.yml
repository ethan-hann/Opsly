# Continuous integration: typecheck, build, and test every pull request
# (and pushes to main) before changes land. A required status check on this
# workflow is what actually blocks merging red PRs — see the note at the bottom.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. new push to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # A live Postgres so the integration suites (src/**/*-db.test.ts and the
    # @workspace/db tests) run instead of auto-skipping.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # vitest.config.ts keys off DATABASE_URL to decide whether to run the
      # live-DB suites; drizzle push-force reads it too.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/opsly_test
      # The frontend's vite.config.ts throws unless PORT and BASE_PATH are set,
      # even for a production build. Values mirror Dockerfile.frontend.
      PORT: "3000"
      BASE_PATH: /

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pnpm
        # Pinned to the lockfile's version; installed via npm to avoid the
        # corepack signature-verification bug.
        run: npm install -g pnpm@10.34.5

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm -r --if-present run build

      - name: Push database schema
        run: pnpm --filter @workspace/db run push-force

      - name: Test
        run: pnpm -r --if-present run test
