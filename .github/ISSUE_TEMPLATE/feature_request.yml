name: Feature request / proposal
description: Propose a change before writing code
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Opsly uses an **issue-first** process: open and discuss a proposal here
        and wait for a maintainer to agree on the approach **before** starting a
        pull request. Unsolicited large PRs are declined regardless of quality —
        see [CONTRIBUTING.md](https://github.com/ethan-hann/Opsly/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to accomplish? What's the underlying need?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The behavior or change you'd like. Sketch the UX or API surface if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why you set them aside.
  - type: dropdown
    id: contribute
    attributes:
      label: Are you willing to implement this?
      description: Only after a maintainer accepts the proposal.
      options:
        - "Yes, if the approach is accepted"
        - "No, requesting someone else build it"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I understand no PR should be opened until a maintainer accepts this proposal.
          required: true
