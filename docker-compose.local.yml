services:
  db:
    image: postgres:16-alpine
    container_name: opsly-db
    environment:
      POSTGRES_DB: opsly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - opsly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opsly"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: opsly-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@db:5432/opsly
      AUTH_MODE: ${AUTH_MODE:-local}
      INSTANCE_ADMIN_TOKEN: ${INSTANCE_ADMIN_TOKEN:-local-dev-admin-token}
      LOCAL_DEV_USER_EMAIL: ${LOCAL_DEV_USER_EMAIL:-admin@example.com}
      LOCAL_DEV_USER_PASSWORD: ${LOCAL_DEV_USER_PASSWORD:-changeme}
      LOCAL_DEV_USER_FIRST_NAME: ${LOCAL_DEV_USER_FIRST_NAME:-Local}
      LOCAL_DEV_USER_LAST_NAME: ${LOCAL_DEV_USER_LAST_NAME:-Admin}
      REPL_ID: ${REPL_ID:-}
      ISSUER_URL: ${ISSUER_URL:-https://replit.com/oidc}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    ports:
      - "8080:8080"
    command: >
      sh -c "
      pnpm --filter @workspace/db run push &&
      pnpm --filter @workspace/db run migrate:add-multi-auth-support &&
      if [ \"$$AUTH_MODE\" = \"local\" ] && [ -n \"$$LOCAL_DEV_USER_EMAIL\" ] && [ -n \"$$LOCAL_DEV_USER_PASSWORD\" ]; then
        pnpm --filter @workspace/db run create-local-user \"$$LOCAL_DEV_USER_EMAIL\" \"$$LOCAL_DEV_USER_PASSWORD\" \"$$LOCAL_DEV_USER_FIRST_NAME\" \"$$LOCAL_DEV_USER_LAST_NAME\";
      fi &&
      pnpm --filter @workspace/api-server run build &&
      node --enable-source-maps artifacts/api-server/dist/index.mjs
      "

  web:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: opsly-web
    depends_on:
      - api
    environment:
      NODE_ENV: development
      PORT: 20999
      BASE_PATH: /
      API_PROXY_TARGET: http://api:8080
    ports:
      - "20999:20999"
    command: pnpm --filter @workspace/it-task-manager run dev

volumes:
  opsly-postgres-data:
