# nginx.frontend.conf — Production nginx config for the Opsly web frontend.
#
# Responsibilities:
#   1. Serve the compiled Vite/React bundle as a SPA (client-side routing via
#      index.html fallback).
#   2. Proxy /api/* to the api container on the internal Docker network,
#      including long-lived SSE connections for real-time notifications.
#   3. Cache hashed static assets aggressively; never cache index.html.
#
# This file is included inside nginx's http { } block (conf.d convention), so
# http-level directives such as map { } are valid here at the top level.

# Map the incoming Upgrade header to the correct Connection value so WebSocket
# and SSE upgrade passthrough works correctly.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip text assets for faster page loads.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/x-font-ttf font/woff font/woff2;
    gzip_min_length 256;

    # ── API proxy ──────────────────────────────────────────────────────────────
    # Forward all /api/* requests to the api service on the internal network.
    #
    # Using a variable for proxy_pass defers hostname resolution to request time
    # (Docker embedded DNS: 127.0.0.11). Without this, nginx refuses to start if
    # the api container hasn't come up yet or its name isn't resolvable at boot.
    resolver 127.0.0.11 valid=30s;
    set $api_upstream http://api:8080;

    location /api/ {
        proxy_pass $api_upstream/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / EventSource upgrade headers.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE (Server-Sent Events): disable response buffering so event chunks
        # reach the browser immediately instead of being held until the buffer fills.
        proxy_buffering    off;
        proxy_cache        off;

        # Long-lived connections for SSE — default proxy_read_timeout is 60 s
        # which is too short for persistent event streams.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Static assets (content-hashed filenames) ───────────────────────────────
    # Vite appends a hash to JS/CSS/image filenames, so these can be cached for
    # one year. The browser will fetch a new URL whenever the content changes.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ───────────────────────────────────────────────────────────
    # Serve index.html for every route that doesn't match a static file so that
    # client-side navigation (wouter) works on full page reloads.
    location / {
        # Never cache index.html — it is the entry point and must always be fresh.
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
